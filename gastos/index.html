/* ---------- Reembolsos ---------- */
function vistaReembolsos(datos, calc) {
  const r = calc.reembolsos;
  let html = '<div class="envoltura">' +
    '<div class="resultado"><div class="rot">Pendiente de reembolsar</div>' +
    '<div class="cifra">' + dinero(r.totalPendiente) + '</div>' +
    '<div class="nota">Dinero personal que se usó para comprar cosas del evento. Reembolsarlo no es un gasto nuevo: la compra ya está registrada.</div></div>';

  html += '<div class="acciones" style="margin:16px 0">' +
    '<button class="btn" data-accion="nuevo-reembolso">＋ Registrar reembolso</button>' +
    '<button class="btn secundario" data-accion="gestionar-personas">Personas</button></div>';

  if (!r.filas.length) {
    html += '<div class="vacio">' + icono('personas', 40) + '<h3>Nadie puso dinero propio</h3>' +
      '<p>Cuando registres un gasto pagado con dinero personal, aparecerá aquí el saldo de esa persona.</p></div></div>';
    return html;
  }

  html += '<div class="seccion"><h2>Saldo por persona</h2><div class="filas-num">' +
    r.filas.map(f =>
      fila(f.nombre, dinero(f.pendiente),
        'Puso ' + dineroPlano(f.pagado) + ' · reembolsado ' + dineroPlano(f.reembolsado),
        f.pendiente > 0 ? 'neg' : 'pos')
    ).join('') + '</div></div>';

  html += '<div class="seccion"><h2>Personas con saldo</h2><ul class="lista">' +
    r.filas.filter(f => f.pendiente !== 0).map(f =>
      '<li><button class="fila" data-accion="nuevo-reembolso" data-persona="' + esc(f.personaId) + '">' +
      '<div class="cuerpo"><div class="t">' + esc(f.nombre) + '</div><div class="s">Registrar reembolso total o parcial</div></div>' +
      '<div class="monto">' + dinero(f.pendiente) + '</div><span class="chevron" aria-hidden="true">›</span></button></li>').join('') +
    '</ul></div>';

  const lista = datos.reembolsos.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  html += '<div class="seccion"><h2>Reembolsos registrados</h2>';
  if (!lista.length) html += '<div class="aviso info">Todavía no se registró ningún reembolso.</div>';
  else html += '<ul class="lista">' + lista.map(x =>
    '<li><div class="fila" style="cursor:default"><div class="cuerpo">' +
    '<div class="t">' + esc(nombrePersona(datos, x.personaId)) + '</div>' +
    '<div class="s">' + esc(fechaCorta(x.fecha)) + (x.nota ? ' · ' + esc(x.nota) : '') + '</div></div>' +
    '<div class="monto">' + dinero(x.importe) + '</div>' +
    '<button class="btn fantasma chico" data-accion="borrar-reembolso" data-id="' + esc(x.id) + '">Quitar</button></div></li>').join('') + '</ul>';
  html += '</div>';

  return html + '</div>';
}

function abrirReembolso(personaId) {
  const datos = estado.datos;
  const calc = estado.calc;
  hoja({
    titulo: 'Registrar reembolso',
    guardar: 'Registrar',
    render(cuerpo) {
      const saldo = calc.reembolsos.filas.find(f => f.personaId === personaId);
      cuerpo.innerHTML =
        '<div class="campo"><label for="r-persona">Persona</label><select id="r-persona">' +
        '<option value="">Sin asignar</option>' +
        datos.personas.map(p => '<option value="' + esc(p.id) + '"' + (personaId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') +
        '</select></div>' +
        '<div class="campo"><label for="r-importe">Importe reembolsado</label>' +
        '<div class="campo-dinero"><span class="signo">$</span><input type="text" inputmode="decimal" id="r-importe" value="' +
        esc(saldo && saldo.pendiente > 0 ? dineroCampo(saldo.pendiente) : '') + '" placeholder="0.00"></div>' +
        '<div class="ayuda">Puede ser total o parcial.</div></div>' +
        '<div class="campo"><label for="r-fecha">Fecha</label><input type="date" id="r-fecha" value="' + hoyISO() + '"></div>' +
        '<div class="campo"><label for="r-nota">Nota (opcional)</label><input type="text" id="r-nota" placeholder="Ej.: transferencia" autocomplete="off"></div>' +
        '<div class="aviso info">Un reembolso no se cuenta como gasto adicional: la compra ya quedó registrada.</div>';
      const sel = cuerpo.querySelector('#r-persona');
      sel.addEventListener('change', () => {
        const f = calc.reembolsos.filas.find(x => x.personaId === sel.value);
        const campo = cuerpo.querySelector('#r-importe');
        if (f && f.pendiente > 0) campo.value = dineroCampo(f.pendiente);
      });
    },
    async alGuardar(cuerpo) {
      const importe = aCentavos(cuerpo.querySelector('#r-importe').value);
      if (importe === null || importe <= 0) { tostada('Escribe el importe reembolsado.', 'malo'); return false; }
      await dbGuardar('reembolsos', {
        id: nuevoId('rb'),
        eventoId: datos.evento.id,
        personaId: cuerpo.querySelector('#r-persona').value,
        importe: importe,
        fecha: cuerpo.querySelector('#r-fecha').value || hoyISO(),
        nota: cuerpo.querySelector('#r-nota').value.trim(),
        creado: Date.now()
      });
      tostada('Reembolso registrado');
      pintar();
      return true;
    }
  });
}

/* ---------- Cerrar / reabrir ---------- */
async function cambiarCierre(cerrar) {
  const datos = estado.datos;
  const calc = estado.calc;
  if (cerrar) {
    const pendientes = calc.faltantes.filter(f => f.indexOf('cerrado') < 0);
    const ok = await confirmar({
      titulo: 'Cerrar evento',
      ok: 'Cerrar evento',
      html: '<p style="margin:0 0 12px;line-height:1.5">El evento quedará marcado como cerrado. Podrás reabrirlo cuando quieras para corregir.</p>' +
        (pendientes.length
          ? '<div class="aviso alerta"><strong>Antes de cerrar, faltan datos:</strong><ul>' + pendientes.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>El resultado seguirá marcado como provisional.</div>'
          : '<div class="aviso bueno"><strong>Todo listo</strong>No faltan datos del cierre.</div>')
    });
    if (!ok) return;
    await dbGuardar('eventos', Object.assign({}, datos.evento, { estado: 'cerrado', cerrado: Date.now(), actualizado: Date.now() }));
    tostada('Evento cerrado');
  } else {
    const ok = await confirmar({
      titulo: 'Reabrir evento',
      texto: 'El evento volverá a "En curso" para que puedas corregir información. Los datos no se pierden.',
      ok: 'Reabrir'
    });
    if (!ok) return;
    await dbGuardar('eventos', Object.assign({}, datos.evento, { estado: 'curso', actualizado: Date.now() }));
    tostada('Evento reabierto');
  }
  pintar();
}

async function borrarEvento() {
  const datos = estado.datos;
  const ok = await confirmar({
    titulo: 'Eliminar evento',
    ok: 'Eliminar todo', peligro: true,
    html: '<p style="margin:0 0 12px;line-height:1.5">Se eliminará <strong>' + esc(datos.evento.nombre) + '</strong> con todos sus gastos, recibos, ventas, caja y reembolsos.</p>' +
      '<div class="aviso malo"><strong>Esto no se puede deshacer</strong>Si quieres conservarlo, exporta antes un respaldo desde la pestaña Respaldo.</div>'
  });
  if (!ok) return;
  const id = datos.evento.id;
  const recibos = await dbPorIndice('recibos', 'eventoId', id);
  await dbBorrarVarios('recibos', recibos.map(r => r.id));
  await dbBorrarVarios('gastos', datos.gastos.map(g => g.id));
  await dbBorrarVarios('ventas', datos.ventas.map(v => v.id));
  await dbBorrarVarios('reembolsos', datos.reembolsos.map(r => r.id));
  await dbBorrar('caja', id);
  await dbBorrar('eventos', id);
  tostada('Evento eliminado');
  estado.pila = [];
  estado.ruta = { v: 'eventos' };
  pintar();
}

/* ---------- Diagnóstico ---------- */
function abrirDiagnostico() {
  hoja({
    titulo: 'Diagnóstico',
    mostrarPie: false,
    render(cuerpo) {
      const texto = (window.__manna && window.__manna.diagnostico)
        ? window.__manna.diagnostico()
        : 'Diagnóstico no disponible en esta versión.';
      cuerpo.innerHTML =
        '<p style="margin:0 0 12px;font-size:14.5px;line-height:1.5;color:var(--texto-suave)">' +
        'Si la app falla en algún dispositivo, copia esto y pégalo en el chat. No contiene datos de eventos ni recibos.</p>' +
        '<div class="acciones" style="margin-bottom:12px"><button class="btn" id="diag-copiar" style="flex:1">Copiar detalles</button></div>' +
        '<textarea id="diag-txt" readonly style="min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45"></textarea>';
      const ta = cuerpo.querySelector('#diag-txt');
      ta.value = texto;
      cuerpo.querySelector('#diag-copiar').onclick = () => {
        ta.focus();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value)
            .then(() => tostada('Detalles copiados', 'bueno'))
            .catch(() => tostada('Selecciona el texto y cópialo a mano.', 'malo'));
          return;
        }
        tostada(ok ? 'Detalles copiados' : 'Selecciona el texto y cópialo a mano.', ok ? 'bueno' : 'malo');
      };
    }
  });
}

          CONFIG.categorias[i] = n; await guardarConfig(); dibujar();
        });

function formProducto(producto, alTerminar) {
  const esNuevo = !producto;
  const p = producto || { id: null, nombre: '', tipo: 'individual', precio: null, activo: true, combo: [] };
  dbTodos('productos').then(todos => {
    const otros = todos.filter(x => x.id !== p.id);
    const h = hoja({
      titulo: esNuevo ? 'Nuevo producto' : 'Editar producto',
      guardar: 'Guardar',
      render(cuerpo) {
        cuerpo.innerHTML =
          '<div class="campo"><label for="p-nombre">Nombre</label>' +
          '<input type="text" id="p-nombre" value="' + esc(p.nombre) + '" placeholder="Ej.: Combo crepe + café" autocomplete="off"></div>' +
          '<div class="grid-2 apila">' +
          '<div class="campo"><label for="p-tipo">Tipo</label><select id="p-tipo">' +
          Object.entries(TIPOS_PRODUCTO).map(([k, t]) => '<option value="' + k + '"' + (p.tipo === k ? ' selected' : '') + '>' + t + '</option>').join('') +
          '</select></div>' +
          '<div class="campo"><label for="p-precio">Precio de venta</label>' +
          '<div class="campo-dinero"><span class="signo">$</span><input type="text" inputmode="decimal" id="p-precio" value="' + esc(dineroCampo(p.precio)) + '" placeholder="0.00"></div></div>' +
          '</div>' +
          '<div id="p-combo-caja"' + (p.tipo === 'combo' ? '' : ' hidden') + '>' +
          '<span class="rotulo">Contenido del combo (opcional)</span>' +
          '<div class="ayuda" style="margin-bottom:8px">Sirve para contar las unidades de cada componente. El ingreso se cuenta una sola vez, en el combo.</div>' +
          '<div id="p-combo"></div>' +
          '<button type="button" class="btn secundario chico" id="p-add-comp">＋ Agregar componente</button></div>';
        const tipo = cuerpo.querySelector('#p-tipo');
        tipo.onchange = () => { cuerpo.querySelector('#p-combo-caja').hidden = tipo.value !== 'combo'; };
        const combo = JSON.parse(JSON.stringify(p.combo || []));
        const pintarCombo = () => {
          const c = cuerpo.querySelector('#p-combo');
          c.innerHTML = combo.map((x, i) =>
            '<div class="grid-2" style="grid-template-columns:1fr 90px 44px;gap:6px;margin-bottom:8px">' +
            '<select data-comp="' + i + '">' + otros.map(o =>
              '<option value="' + esc(o.id) + '"' + (x.productoId === o.id ? ' selected' : '') + '>' + esc(o.nombre) + '</option>').join('') + '</select>' +
            '<input type="number" min="1" step="1" value="' + (x.cantidad || 1) + '" data-cant="' + i + '">' +
            '<button type="button" class="btn fantasma chico" data-quita="' + i + '">✕</button></div>').join('') ||
            '<div style="font-size:13px;color:var(--texto-suave);margin-bottom:8px">Sin componentes.</div>';
          c.querySelectorAll('[data-comp]').forEach(s => s.onchange = () => { combo[Number(s.dataset.comp)].productoId = s.value; });
          c.querySelectorAll('[data-cant]').forEach(s => s.oninput = () => { combo[Number(s.dataset.cant)].cantidad = Math.max(1, Number(s.value) || 1); });
          c.querySelectorAll('[data-quita]').forEach(b => b.onclick = () => { combo.splice(Number(b.dataset.quita), 1); pintarCombo(); });
        };
        cuerpo.querySelector('#p-add-comp').onclick = () => {
          if (!otros.length) { tostada('Primero crea los productos individuales.', 'malo'); return; }
          combo.push({ productoId: otros[0].id, cantidad: 1 }); pintarCombo();
        };
        pintarCombo();
        cuerpo._combo = combo;
      },
      async alGuardar(cuerpo) {
        const nombre = cuerpo.querySelector('#p-nombre').value.trim();
        if (!nombre) { tostada('Escribe el nombre del producto.', 'malo'); return false; }
        const precio = aCentavos(cuerpo.querySelector('#p-precio').value);
        if (precio === null || precio < 0) { tostada('Escribe el precio.', 'malo'); return false; }
        const tipo = cuerpo.querySelector('#p-tipo').value;
        await dbGuardar('productos', {
          id: p.id || nuevoId('pr'),
          nombre, tipo, precio, activo: true,
          combo: tipo === 'combo' ? (cuerpo._combo || []) : [],
          creado: p.creado || Date.now(), actualizado: Date.now()
        });
        tostada('Producto guardado');
        if (alTerminar) alTerminar();
        return true;
      }
    });
    if (!esNuevo) {
      const pie = h.fondo.querySelector('.hoja-pie');
      const b = document.createElement('button');
      b.className = 'btn peligro'; b.style.flex = '0 0 auto'; b.textContent = 'Eliminar';
      b.onclick = async () => {
        const ok = await confirmar({ titulo: 'Eliminar producto', texto: '"' + p.nombre + '" saldrá del catálogo. Las ventas ya registradas no cambian.', ok: 'Eliminar', peligro: true });
        if (!ok) return;
        await dbBorrar('productos', p.id);
        tostada('Producto eliminado'); h.cerrar(); if (alTerminar) alTerminar();
      };
      pie.insertBefore(b, pie.firstChild);
    }
  });
}

function localStorageSeguro(clave, valor) {
  try {
    if (valor !== undefined) { localStorage.setItem(clave, valor); return valor; }
    return localStorage.getItem(clave);
  } catch (e) { return null; }
}

function extensionDe(nombre, mime) {
  const m = /\.([A-Za-z0-9]{1,6})$/.exec(nombre || '');
  if (m) return m[1].toLowerCase();
  const mapa = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/heic': 'heic', 'image/heif': 'heif', 'image/webp': 'webp', 'application/pdf': 'pdf' };
  return mapa[mime] || 'bin';
}

/* ---------- Exportar ---------- */
async function exportarRespaldo() {
  tostada('Preparando el respaldo…');
  const [eventos, gastos, ventas, caja, personas, reembolsos, productos, meta, recibos] = await Promise.all([
    dbTodos('eventos'), dbTodos('gastos'), dbTodos('ventas'), dbTodos('caja'),
    dbTodos('personas'), dbTodos('reembolsos'), dbTodos('productos'), dbTodos('meta'), dbTodos('recibos')
  ]);

  const entradas = [];
  const recibosMeta = [];
  for (const r of recibos) {
    const ext = extensionDe(r.nombre, r.mime);
    const ruta = 'recibos/' + r.id + '.' + ext;
    const bytes = new Uint8Array(await r.archivo.arrayBuffer());
    entradas.push({ nombre: ruta, datos: bytes });
    recibosMeta.push({
      id: r.id, gastoId: r.gastoId, eventoId: r.eventoId, nombre: r.nombre,
      mime: r.mime, tamano: bytes.length, creado: r.creado, archivo: ruta, crc32: crc32(bytes)
    });
  }

  const datos = { eventos, gastos, ventas, caja, personas, reembolsos, productos, meta, recibos: recibosMeta };
  const ahora = new Date();
  const manifiesto = {
    formato: 'MANNA-Gastos-Respaldo',
    version: APP.formatoRespaldo,
    app: APP.nombre,
    appVersion: APP.version,
    creado: ahora.toISOString(),
    conteos: {
      eventos: eventos.length, gastos: gastos.length, ventas: ventas.length,
      recibos: recibosMeta.length, personas: personas.length, reembolsos: reembolsos.length, productos: productos.length
    }
  };
  const cod = new TextEncoder();
  entradas.unshift({ nombre: 'datos.json', datos: cod.encode(JSON.stringify(datos)) });
  entradas.unshift({ nombre: 'manifiesto.json', datos: cod.encode(JSON.stringify(manifiesto, null, 2)) });
  entradas.push({
    nombre: 'LEEME.txt', datos: cod.encode(
      'Respaldo de ' + APP.nombre + '\n' +
      'Creado: ' + ahora.toLocaleString('es') + '\n\n' +
      'Este ZIP contiene todos los datos y los recibos originales.\n' +
      'Para restaurarlo: abre la app, ve a Respaldo y toca "Restaurar respaldo".\n' +
      'Guárdalo en una carpeta llamada "' + CARPETA_SUGERIDA + '".\n')
  });

  const blob = zipCrear(entradas);
  const nombre = 'MANNA-Gastos-' + selloArchivo(ahora) + '.zip';
  const r = await entregarArchivo(nombre, blob);
  if (r.via === 'cancelado') { tostada('Respaldo cancelado'); return; }
  localStorageSeguro('manna-ultimo-respaldo', String(Date.now()));
  tostada('Respaldo listo: ' + nombre, 'bueno');
  if (estado.ruta.v === 'respaldo') pintar();
}

async function revisarRespaldo(archivo) {

    (problemas.length

        (problemas.length > 6 ? '<li>y ' + (problemas.length - 6) + ' más…</li>' : '') +
        '</ul>Puedes restaurar igualmente: se recuperará todo lo que sí esté completo.</div>'

    '<button class="btn secundario ancho" data-accion="exportar-respaldo" style="margin-top:12px">Exportar mis datos actuales primero</button>';

  const ok = await confirmar({ titulo: 'Restaurar respaldo', ok: 'Restaurar ahora', peligro: true, html: html });
  if (!ok) return;

  try {

        '<p style="font-size:14px;line-height:1.5">Tus datos anteriores siguen intactos.</p>'
    });
  }
}

/** Valida el ZIP sin tocar la base de datos. */
async function validarRespaldo(archivo) {
  const buffer = await archivo.arrayBuffer();
  const mapa = await zipLeer(buffer);
  const dec = new TextDecoder();

  const manifiestoBytes = mapa.get('manifiesto.json') || mapa.get('manifest.json');
  if (!manifiestoBytes) throw new Error('Falta el manifiesto: el archivo no es un respaldo de MANNA Gastos.');
  let manifiesto;
  try { manifiesto = JSON.parse(dec.decode(manifiestoBytes)); }
  catch (e) { throw new Error('El manifiesto del respaldo está dañado.'); }
  if (manifiesto.formato !== 'MANNA-Gastos-Respaldo') throw new Error('Este ZIP es de otra aplicación.');
  if (!(Number(manifiesto.version) <= APP.formatoRespaldo)) {
    throw new Error('El respaldo usa el formato ' + manifiesto.version + ' y esta versión de la app sólo entiende hasta el ' + APP.formatoRespaldo + '. Actualiza la app.');
  }

  const datosBytes = mapa.get('datos.json');
  if (!datosBytes) throw new Error('Falta el archivo de datos dentro del respaldo.');
  let datos;
  try { datos = JSON.parse(dec.decode(datosBytes)); }
  catch (e) { throw new Error('Los datos del respaldo están dañados y no se pueden leer.'); }
  for (const nombre of ['eventos', 'gastos', 'ventas', 'caja', 'personas', 'reembolsos', 'productos', 'recibos']) {
    if (!Array.isArray(datos[nombre])) throw new Error('El respaldo está incompleto: falta la sección "' + nombre + '".');
  }

  const problemas = [];
  const recibos = [];
  for (const r of datos.recibos) {
    const bytes = mapa.get(r.archivo);
    if (!bytes) { problemas.push('Falta el archivo del recibo "' + (r.nombre || r.id) + '".'); continue; }
    if (r.tamano !== undefined && bytes.length !== r.tamano) {
      problemas.push('El recibo "' + (r.nombre || r.id) + '" tiene un tamaño distinto al registrado.');
      continue;
    }
    if (r.crc32 !== undefined && crc32(bytes) !== r.crc32) {
      problemas.push('El recibo "' + (r.nombre || r.id) + '" no pasó la verificación de integridad.');
      continue;
    }
    recibos.push({
      id: r.id, gastoId: r.gastoId, eventoId: r.eventoId, nombre: r.nombre,
      mime: r.mime, tamano: bytes.length, creado: r.creado,
      archivo: new Blob([bytes], { type: r.mime || 'application/octet-stream' })
    });
  }

  return {
    creado: manifiesto.creado ? Date.parse(manifiesto.creado) : null,
    appVersion: manifiesto.appVersion,
    conteos: {
      eventos: datos.eventos.length, gastos: datos.gastos.length,
      recibos: datos.recibos.length, ventas: datos.ventas.length
    },
    problemas,
    contenido: {
      eventos: datos.eventos, gastos: datos.gastos, ventas: datos.ventas, caja: datos.caja,
      personas: datos.personas, reembolsos: datos.reembolsos, productos: datos.productos,
      meta: Array.isArray(datos.meta) ? datos.meta : [], recibos: recibos
    }
  };
}

/** Escribe el respaldo validado en una sola transacción: o entra todo, o no entra nada. */
async function aplicarRespaldo(revision) {
  await dbReemplazarTodo(revision.contenido);
  return true;
}

function asegurarMetas() {
  const metas = [
    { name: 'viewport', content: 'width=device-width, initial-scale=1, viewport-fit=cover' },
    { name: 'apple-mobile-web-app-capable', content: 'yes' },
    { name: 'mobile-web-app-capable', content: 'yes' },
    { name: 'apple-mobile-web-app-status-bar-style', content: 'default' },
    { name: 'apple-mobile-web-app-title', content: 'MANNA Gastos' },
    { name: 'theme-color', content: '#4A342A' }
  ];
  for (const m of metas) {
    if (document.querySelector('meta[name="' + m.name + '"]')) continue;
    const el = document.createElement('meta');
    el.setAttribute('name', m.name);
    el.setAttribute('content', m.content);
    document.head.appendChild(el);
  }
  if (!document.querySelector('link[rel="manifest"]')) {
    const l = document.createElement('link');
    l.rel = 'manifest'; l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
  }
}

/**
 * Intenta registrar un service worker para que la app abra sin conexión.
 * Si no hay sw.js junto a la página (por ejemplo al abrir el archivo suelto),
 * falla en silencio y la app sigue funcionando igual.
 */
function registrarServicio() {
  try {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* sin conexión persistente: no es un error para el usuario */ }
}

function fase(texto) {
  if (window.__manna && window.__manna.marcarFase) window.__manna.marcarFase(texto);
}

async function iniciar() {
  try {
    fase('preparando la página');
    asegurarMetas();

    fase('abriendo el almacenamiento');
    await abrirDB();

    fase('leyendo la configuración');
    await cargarConfig();

    fase('dibujando la pantalla');
    try { history.replaceState({ ruta: estado.ruta }, ''); } catch (e) {}
    await pintar();

    if (window.__manna) window.__manna.lista = true;

    /* Estos dos pueden fallar sin consecuencias: van después de la primera pantalla. */
    pedirPersistencia();
    registrarServicio();
  } catch (err) {
    console.error(err);
    const titulo = (err && (err.codigo === 'tiempo-agotado' || err.codigo === 'sin-indexeddb' ||
      err.codigo === 'error-apertura' || err.codigo === 'bloqueado' || err.codigo === 'excepcion'))
      ? 'No se pudo abrir el almacenamiento de la app'
      : 'La app no terminó de abrir';
    if (window.__manna && window.__manna.fallo) window.__manna.fallo(titulo, err);
    else {
      $('#pantalla').innerHTML = '<div class="envoltura"><div class="aviso malo"><strong>' + esc(titulo) + '</strong>' +
        esc(err && err.message ? err.message : String(err)) + '</div></div>';
    }
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();

/* Superficie de depuración y pruebas. No la usa la interfaz. */
window.MANNA = {
  APP, CONFIG, estado,
  aCentavos, dinero, dineroCampo, partirImpuesto,
  calcularEvento, cargarEvento, calcularVentas, calcularCaja, calcularGastos, calcularReembolsos,
  dbTodos, dbObtener, dbGuardar, dbPorIndice, dbBorrar, dbReemplazarTodo,
  zipCrear, zipLeer, crc32,
  exportarRespaldo, validarRespaldo, aplicarRespaldo, revisarRespaldo,
  pintar, ir, nuevoId, nuevoEvento, nuevaCaja
};

window.addEventListener('error', ev => {
  console.error('Error no controlado', ev.error || ev.message);
});
window.addEventListener('unhandledrejection', ev => {
  console.error('Promesa rechazada', ev.reason);
});

})();
</script>
