<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MANNA Gastos">
<meta name="theme-color" content="#4A342A">
<meta name="description" content="Control de gastos, recibos, ventas y resultados por evento para MANNA.">
<title>MANNA Gastos de Eventos</title>
<style>
/* ===========================================================
   MANNA Gastos de Eventos
   Identidad tomada del Cotizador MANNA (color de marca #4A342A).
   Todo el color vive en variables: cambiar la identidad completa
   es editar estos bloques.
   Tipografía: pila del sistema (San Francisco en iPhone). No se
   cargan fuentes externas porque la app debe funcionar sin conexión.
   =========================================================== */
:root{
  --cafe:#4A342A;
  --cafe-oscuro:#2E211A;
  --cafe-medio:#6E5346;
  --cafe-suave:#8B7263;
  --sobre-cafe:#FFFFFF;
  --fondo:#FAF6F0;
  --fondo-2:#F2E9DE;
  --superficie:#FFFFFF;
  --superficie-2:#FBF8F4;
  --linea:#E6DBCE;
  --linea-fuerte:#D3C3B2;
  --texto:#2B211B;
  --texto-suave:#7C6B5E;
  --acento:#B9722C;
  --acento-suave:#F7E9D8;
  --ok:#2E7D57;
  --ok-suave:#E4F2EB;
  --aviso:#9C5A12;
  --aviso-suave:#FBEBD6;
  --error:#A3302A;
  --error-suave:#F9E4E2;
  --sombra:0 1px 2px rgba(46,33,26,.06), 0 8px 24px rgba(46,33,26,.07);
  --sombra-alta:0 -6px 30px rgba(46,33,26,.16);
  --r:14px;
  --r-s:10px;
  --fuente:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cafe:#CFAA8C;
    --cafe-oscuro:#EBDCCD;
    --cafe-medio:#AE8C71;
    --cafe-suave:#8C7259;
    --sobre-cafe:#241A14;
    --fondo:#191411;
    --fondo-2:#221A15;
    --superficie:#221A15;
    --superficie-2:#2A211B;
    --linea:#3A2E26;
    --linea-fuerte:#4E3F35;
    --texto:#F3EAE1;
    --texto-suave:#B5A294;
    --acento:#E09A55;
    --acento-suave:#3A2A1B;
    --ok:#63C293;
    --ok-suave:#18301F;
    --aviso:#E2A15A;
    --aviso-suave:#342310;
    --error:#EC8E84;
    --error-suave:#3B1D1A;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --sombra-alta:0 -6px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cafe:#CFAA8C;
  --cafe-oscuro:#EBDCCD;
  --cafe-medio:#AE8C71;
  --cafe-suave:#8C7259;
  --sobre-cafe:#241A14;
  --fondo:#191411;
  --fondo-2:#221A15;
  --superficie:#221A15;
  --superficie-2:#2A211B;
  --linea:#3A2E26;
  --linea-fuerte:#4E3F35;
  --texto:#F3EAE1;
  --texto-suave:#B5A294;
  --acento:#E09A55;
  --acento-suave:#3A2A1B;
  --ok:#63C293;
  --ok-suave:#18301F;
  --aviso:#E2A15A;
  --aviso-suave:#342310;
  --error:#EC8E84;
  --error-suave:#3B1D1A;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --sombra-alta:0 -6px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--fondo);
  color:var(--texto);
  font-family:var(--fuente);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px));
  overscroll-behavior-y:none;
}
body.sin-barra{padding-bottom:24px}
img{max-width:100%}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Encabezado ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;
  background:var(--cafe);color:var(--sobre-cafe);
  padding:12px 16px calc(12px);
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}
.top .marca{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;font-weight:600}
.top h1{font-size:17px;margin:0;font-weight:650;line-height:1.2;text-wrap:balance}
.top .titulo-bloque{flex:1;min-width:0}
.top .sub{font-size:12.5px;opacity:.8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-atras{
  appearance:none;border:0;background:rgba(255,255,255,.16);color:inherit;
  width:38px;height:38px;border-radius:50%;font-size:19px;line-height:1;
  display:grid;place-items:center;cursor:pointer;flex:none;
}
.btn-icono-top{appearance:none;border:0;background:rgba(255,255,255,.16);color:inherit;height:38px;padding:0 13px;border-radius:19px;font-size:14px;font-weight:600;cursor:pointer;flex:none}

/* ---------- Contenedor ---------- */
.envoltura{max-width:720px;margin:0 auto;padding:16px;padding-block:16px}
.seccion{margin-bottom:22px}
.seccion > h2{
  font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--texto-suave);margin:0 0 8px;font-weight:700;
}

/* ---------- Tarjetas y listas ---------- */
.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.tarjeta + .tarjeta{margin-top:10px}
.lista{list-style:none;margin:0;padding:0;background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.lista > li{border-top:1px solid var(--linea)}
.lista > li:first-child{border-top:0}
.fila{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 14px;background:none;border:0;text-align:left;
  font:inherit;color:inherit;cursor:pointer;
}
.fila:active{background:var(--superficie-2)}
.fila .cuerpo{flex:1;min-width:0}
.fila .t{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.fila .s{font-size:13px;color:var(--texto-suave);margin-top:2px;overflow-wrap:anywhere}
.fila .monto{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .chevron{color:var(--linea-fuerte);font-size:18px;flex:none}

/* ---------- Estado / etiquetas ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.prep{background:var(--fondo-2);color:var(--texto-suave)}
.pill.curso{background:var(--ok-suave);color:var(--ok)}
.pill.cerrado{background:var(--acento-suave);color:var(--acento)}
.pill.aviso{background:var(--aviso-suave);color:var(--aviso)}
.pill.error{background:var(--error-suave);color:var(--error)}
.pill.neutro{background:var(--fondo-2);color:var(--texto-suave)}
.etiqueta-origen{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:6px;background:var(--fondo-2);color:var(--texto-suave)}
.etiqueta-origen.personal{background:var(--aviso-suave);color:var(--aviso)}

/* ---------- Botones ---------- */
.btn{
  appearance:none;border:1px solid transparent;border-radius:var(--r-s);
  font:inherit;font-weight:650;font-size:16px;
  padding:13px 16px;min-height:48px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--cafe);color:var(--sobre-cafe);
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn.secundario{background:var(--superficie);color:var(--cafe);border-color:var(--linea-fuerte)}
.btn.fantasma{background:transparent;color:var(--texto-suave);border-color:var(--linea)}
.btn.peligro{background:var(--error);color:#fff}
.btn.acento{background:var(--acento);color:#fff}
.btn.ancho{width:100%}
.btn.chico{min-height:38px;padding:8px 12px;font-size:14px;border-radius:8px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.acciones .btn{flex:1 1 140px}

.acciones-grandes{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.acciones-grandes .btn{min-height:76px;flex-direction:column;gap:4px;font-size:15px;line-height:1.2;padding:12px 10px;text-align:center}
.acciones-grandes .btn .ico{font-size:21px}
.acciones-grandes .btn.span2{grid-column:1 / -1;min-height:56px;flex-direction:row}

/* ---------- Formularios ---------- */
.campo{margin-bottom:14px}
.campo > label, .rotulo{display:block;font-size:13px;font-weight:650;color:var(--texto-suave);margin-bottom:5px}
.campo .ayuda{font-size:12.5px;color:var(--texto-suave);margin-top:5px;line-height:1.35}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;font:inherit;font-size:16px;
  padding:12px 13px;min-height:48px;
  border:1px solid var(--linea-fuerte);border-radius:var(--r-s);
  background:var(--superficie);color:var(--texto);
}
textarea{min-height:72px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cafe-suave) 50%),linear-gradient(135deg,var(--cafe-suave) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 13px) 21px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
input::placeholder,textarea::placeholder{color:var(--cafe-suave);opacity:.7}
.campo-dinero{position:relative}
.campo-dinero input{padding-left:32px;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;min-height:56px}
.campo-dinero .signo{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--texto-suave);font-size:19px;font-weight:600;pointer-events:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:430px){.grid-2.apila{grid-template-columns:1fr}}
.segmentado{display:flex;gap:0;border:1px solid var(--linea-fuerte);border-radius:var(--r-s);overflow:hidden}
.segmentado button{
  flex:1;appearance:none;border:0;border-left:1px solid var(--linea);
  background:var(--superficie);color:var(--texto-suave);
  font:inherit;font-size:14px;font-weight:650;padding:12px 6px;min-height:48px;cursor:pointer;
}
.segmentado button:first-child{border-left:0}
.segmentado button[aria-pressed="true"]{background:var(--cafe);color:var(--sobre-cafe)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;border:1px solid var(--linea-fuerte);background:var(--superficie);
  color:var(--texto);font:inherit;font-size:14px;font-weight:600;
  padding:9px 13px;min-height:42px;border-radius:999px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--cafe);color:var(--sobre-cafe);border-color:var(--cafe)}
.interruptor{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.interruptor input{width:22px;height:22px;flex:none;accent-color:var(--cafe)}
.interruptor .txt{font-size:15px;line-height:1.3}
.interruptor .txt small{display:block;color:var(--texto-suave);font-size:12.5px;margin-top:2px}

/* ---------- Barra inferior ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--superficie);border-top:1px solid var(--linea);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:4px;box-shadow:var(--sombra-alta);
}
.barra button{
  flex:1;appearance:none;border:0;background:none;color:var(--texto-suave);
  font:inherit;font-size:11px;font-weight:650;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;min-height:52px;border-radius:10px;
}
.barra button .ico{font-size:19px;line-height:1}
.barra button[aria-current="page"]{color:var(--cafe);background:var(--fondo-2)}

/* ---------- Hoja modal ---------- */
.hoja-fondo{position:fixed;inset:0;z-index:60;background:rgba(30,20,14,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja{
  background:var(--fondo);width:100%;max-width:720px;max-height:94vh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:sube .22s ease-out;
}
@keyframes sube{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.hoja-top{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--linea);background:var(--superficie);flex:none;
}
.hoja-top h2{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.hoja-cuerpo{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.hoja-pie{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--linea);background:var(--superficie);flex:none;
  display:flex;gap:10px;
}
.hoja-pie .btn{flex:1}
.cerrar{appearance:none;border:0;background:var(--fondo-2);color:var(--texto-suave);width:36px;height:36px;border-radius:50%;font-size:19px;cursor:pointer;flex:none;display:grid;place-items:center}

/* ---------- Resumen / cifras ---------- */
.resultado{
  background:var(--cafe);color:var(--sobre-cafe);border-radius:var(--r);
  padding:18px 16px;box-shadow:var(--sombra);
}
.resultado .rot{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:700}
.resultado .cifra{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px;letter-spacing:-.02em}
.resultado .nota{font-size:13px;opacity:.85;margin-top:6px;line-height:1.35}
.resultado.negativo .cifra{color:#FFC9C2}
.filas-num{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.filas-num .n{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 14px;border-top:1px solid var(--linea);font-size:15px}
.filas-num .n:first-child{border-top:0}
.filas-num .n .v{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.filas-num .n.total{background:var(--superficie-2);font-weight:700}
.filas-num .n .k small{display:block;font-size:12px;color:var(--texto-suave);font-weight:400;margin-top:1px}
.filas-num .n.neg .v{color:var(--error)}
.filas-num .n.pos .v{color:var(--ok)}
.sangria{padding-left:26px !important;font-size:14px;color:var(--texto-suave)}

/* ---------- Avisos ---------- */
.aviso{border-radius:var(--r-s);padding:12px 14px;font-size:14px;line-height:1.4;border:1px solid}
.aviso.info{background:var(--fondo-2);border-color:var(--linea);color:var(--texto-suave)}
.aviso.alerta{background:var(--aviso-suave);border-color:var(--aviso);color:var(--aviso)}
.aviso.malo{background:var(--error-suave);border-color:var(--error);color:var(--error)}
.aviso.bueno{background:var(--ok-suave);border-color:var(--ok);color:var(--ok)}
.aviso strong{display:block;margin-bottom:3px}
.aviso + .aviso{margin-top:10px}
.aviso ul{margin:6px 0 0;padding-left:18px}

/* ---------- Vacío ---------- */
.vacio{text-align:center;padding:34px 20px;color:var(--texto-suave)}
.vacio .ico{font-size:38px;opacity:.5}
.vacio h3{margin:10px 0 4px;font-size:17px;color:var(--texto);font-weight:650}
.vacio p{margin:0 auto;font-size:14.5px;max-width:34ch;line-height:1.45}
.vacio .btn{margin-top:16px}

/* ---------- Recibos ---------- */
.recibos{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.recibo{position:relative;width:82px;height:82px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--linea-fuerte);background:var(--fondo-2);cursor:pointer;padding:0;appearance:none}
.recibo img{width:100%;height:100%;object-fit:cover;display:block}
.recibo .doc{display:grid;place-items:center;height:100%;font-size:11px;color:var(--texto-suave);padding:6px;text-align:center;line-height:1.2;word-break:break-all}
.recibo .quitar{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(30,20,14,.72);color:#fff;border:0;font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer}
.visor{position:fixed;inset:0;z-index:80;background:rgba(20,14,10,.94);display:flex;flex-direction:column}
.visor img{flex:1;object-fit:contain;min-height:0;width:100%}
.visor .visor-top{display:flex;gap:10px;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;color:#fff}
.visor .visor-top .nom{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor .visor-pie{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}

/* ---------- Avisos flotantes ---------- */
#tostadas{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tostada{
  background:var(--texto);color:var(--fondo);border-radius:12px;padding:11px 16px;
  font-size:14.5px;font-weight:600;max-width:560px;box-shadow:var(--sombra-alta);
  animation:sube .2s ease-out;line-height:1.35;
}
.tostada.malo{background:var(--error);color:#fff}
.tostada.bueno{background:var(--ok);color:#fff}

/* ---------- Tabla de ventas ---------- */
.tabla-envoltura{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);box-shadow:var(--sombra)}
table.datos{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
table.datos th,table.datos td{padding:9px 11px;text-align:left;border-top:1px solid var(--linea)}
table.datos thead th{border-top:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-suave);background:var(--superficie-2)}
table.datos td.num,table.datos th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.datos tfoot td{font-weight:700;background:var(--superficie-2)}

.sep{height:1px;background:var(--linea);margin:18px 0;border:0}
.nota-pie{font-size:12.5px;color:var(--texto-suave);line-height:1.45;margin-top:10px}
.cargando{display:grid;place-items:center;padding:60px 20px;color:var(--texto-suave)}
@media print{
  .top,.barra,.hoja-pie,.btn,#tostadas{display:none !important}
  body{padding:0;background:#fff}
  .tarjeta,.lista,.filas-num,.tabla-envoltura{box-shadow:none}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<noscript>
  <div style="max-width:640px;margin:0 auto;padding:22px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <h2 style="margin:0 0 10px;font-size:20px;line-height:1.25;color:var(--texto)">Este visor no ejecuta JavaScript</h2>
    <div style="background:var(--aviso-suave);border:1px solid var(--aviso);color:var(--aviso);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:12px">
      <strong style="display:block;margin-bottom:4px">Qué pasó</strong>
      La app necesita JavaScript y aquí está desactivado. Suele ocurrir al tocar el archivo
      <strong>index.html</strong> en la app Archivos o en una vista previa del iPhone: esa vista previa
      muestra la página pero no ejecuta el programa.
    </div>
    <div style="background:var(--ok-suave);border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:12px">
      <strong style="display:block;margin-bottom:4px">Cómo abrirla bien</strong>
      Ábrela en <strong>Safari</strong> desde una dirección web que empiece por <strong>https://</strong>,
      y añádela a la pantalla de inicio desde el botón Compartir. No funciona tocando el archivo suelto.
    </div>
    <p style="font-size:13.5px;color:var(--texto-suave);line-height:1.5;margin:0">

  if (!s) return null;
  const negativo = /^-/.test(s) || /^\(.*\)$/.test(s);

  const ultimoPunto = s.lastIndexOf('.');

  if (ultimaComa >= 0 && ultimoPunto >= 0) sep = Math.max(ultimaComa, ultimoPunto);
  else if (ultimaComa >= 0) sep = ultimaComa;
  else if (ultimoPunto >= 0) sep = ultimoPunto;

    const crc = crc32(datos);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);      // nombres en UTF-8
    lh.setUint16(8, 0, true);           // método 0 = almacenado
    lh.setUint16(10, ahora.t, true);
    lh.setUint16(12, ahora.f, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, datos.length, true);
    lh.setUint32(22, datos.length, true);
    lh.setUint16(26, nombre.length, true);
    lh.setUint16(28, 0, true);
    partes.push(new Uint8Array(lh.buffer), nombre, datos);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, ahora.t, true);
    cd.setUint16(14, ahora.f, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, datos.length, true);
    cd.setUint32(24, datos.length, true);
    cd.setUint16(28, nombre.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nombre);
    offset += 30 + nombre.length + datos.length;
  }
  let tamCentral = 0;
  for (const p of central) tamCentral += p.length;
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, entradas.length, true);
  eo.setUint16(10, entradas.length, true);
  eo.setUint32(12, tamCentral, true);
  eo.setUint32(16, offset, true);
  return new Blob(partes.concat(central, [new Uint8Array(eo.buffer)]), { type: 'application/zip' });
}
/** ArrayBuffer -> Map<nombre, Uint8Array>. Lanza error si el ZIP no es legible. */
async function zipLeer(buffer) {
  const b = new Uint8Array(buffer);
  const v = new DataView(buffer);
  let eocd = -1;
  const desde = Math.max(0, b.length - 66000);
  for (let i = b.length - 22; i >= desde; i--) {
    if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('El archivo no es un ZIP legible.');
  const total = v.getUint16(eocd + 10, true);
  let p = v.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const salida = new Map();
  for (let i = 0; i < total; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('El índice del ZIP está dañado.');
    const metodo = v.getUint16(p + 10, true);
    const tamComp = v.getUint32(p + 20, true);
    const lenN = v.getUint16(p + 28, true);
    const lenE = v.getUint16(p + 30, true);
    const lenC = v.getUint16(p + 32, true);
    const off = v.getUint32(p + 42, true);
    const nombre = dec.decode(b.subarray(p + 46, p + 46 + lenN));
    if (v.getUint32(off, true) !== 0x04034b50) throw new Error('Una entrada del ZIP está dañada: ' + nombre);
    const lnN = v.getUint16(off + 26, true);
    const lnE = v.getUint16(off + 28, true);
    const ini = off + 30 + lnN + lnE;
    let datos = b.subarray(ini, ini + tamComp);
    if (metodo === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Este respaldo usa compresión que el navegador no puede abrir.');
      const ds = new DecompressionStream('deflate-raw');
      const flujo = new Blob([datos]).stream().pipeThrough(ds);
      datos = new Uint8Array(await new Response(flujo).arrayBuffer());
    } else if (metodo !== 0) {
      throw new Error('Compresión no soportada en la entrada: ' + nombre);
    }
    if (!nombre.endsWith('/')) salida.set(nombre, datos);
    p += 46 + lenN + lenE + lenC;
  }
  return salida;
}

/* ---------- Guardar / compartir archivos ---------- */
/**
 * Entrega un archivo al usuario. Orden de intentos:
 * 1) capacidad de descarga del visor (artefacto publicado),
 * 2) hoja de compartir del iPhone (guardar en Archivos),
 * 3) descarga directa del navegador.
 */
async function entregarArchivo(nombre, blob) {
  const enVisor = !!(window.claude && typeof window.claude.use === 'function');
  if (enVisor) {
    let guardar = null;
    try {
      const d = await window.claude.use('downloads');
      if (d && typeof d.save === 'function') guardar = d.save;
      else throw new Error('sin capacidad de descarga');
    } catch (err) {
      console.warn('descarga del visor no disponible', err);
      throw new Error('Este visor no permite guardar archivos. Abre la app desde el archivo HTML o desde su propia dirección para exportar el respaldo.');
    }
    try {
      await guardar({ filename: nombre, data: blob });
      return { via: 'visor' };
    } catch (err) {
      if (err && (err.code === 'declined' || err.code === 'rate_limited')) return { via: 'cancelado' };
      throw new Error('No se pudo guardar el archivo: ' + ((err && err.message) || 'el visor lo rechazó'));
    }
  }
  try {
    const archivo = new File([blob], nombre, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] }) && navigator.share) {
      await navigator.share({ files: [archivo], title: nombre });
      return { via: 'compartir' };
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return { via: 'cancelado' };
    console.warn('compartir no disponible', err);
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return { via: 'descarga' };
}

function tamLegible(bytes) {
  if (!bytes && bytes !== 0) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function plural(n, sing, pl) { return n === 1 ? '1 ' + sing : n + ' ' + (pl || sing + 's'); }


/* ===== 30-db.js ===== */
/* ============================================================
   Almacenamiento local (IndexedDB)
   Datos estructurados + recibos originales como archivos (Blob).
   Si el almacenamiento falla, la app lo dice: nunca muestra que
   algo se guardó cuando no se guardó.
   ============================================================ */
const DB_NOMBRE = 'manna-gastos';
const DB_VERSION = 1;
const ALMACENES = {
  meta: { keyPath: 'k' },
  eventos: { keyPath: 'id', indices: [] },
  gastos: { keyPath: 'id', indices: ['eventoId'] },
  recibos: { keyPath: 'id', indices: ['gastoId', 'eventoId'] },
  personas: { keyPath: 'id', indices: [] },
  reembolsos: { keyPath: 'id', indices: ['eventoId', 'personaId'] },
  productos: { keyPath: 'id', indices: [] },
  ventas: { keyPath: 'id', indices: ['eventoId'] },
  caja: { keyPath: 'eventoId', indices: [] }
};

let _db = null;

function fallo(codigo, mensaje) {
  const e = new Error(mensaje);
  e.codigo = codigo;
  return e;
}
function espera(ms) { return new Promise(r => setTimeout(r, ms)); }

/**
 * Un intento de abrir la base, con límite de tiempo.
 * El límite existe porque en Safari de iPhone indexedDB.open() puede
 * quedarse sin responder nunca (navegación privada, almacenamiento
 * bloqueado, o la app dentro de un visor incrustado). Sin límite, la
 * app se queda en "Abriendo…" para siempre.
 */
function abrirDBUnaVez(msLimite) {
  return new Promise((resolve, reject) => {
    let hay = false;
    try { hay = !!window.indexedDB; } catch (e) { hay = false; }
    if (!hay) {
      reject(fallo('sin-indexeddb', 'Este navegador no permite guardar datos (IndexedDB no está disponible o está bloqueado).'));
      return;
    }
    let sol;
    try { sol = indexedDB.open(DB_NOMBRE, DB_VERSION); }
    catch (e) {
      reject(fallo('excepcion', 'El navegador rechazó abrir el almacenamiento: ' + (e && e.name ? e.name + ' — ' : '') + (e && e.message ? e.message : e)));
      return;
    }
    let cerrado = false;
    const terminar = (fn, arg) => { if (cerrado) return; cerrado = true; clearTimeout(reloj); fn(arg); };
    const reloj = setTimeout(() => {
      terminar(reject, fallo('tiempo-agotado',
        'El almacenamiento local no respondió en ' + Math.round(msLimite / 1000) + ' segundos.'));
    }, msLimite);

    sol.onupgradeneeded = ev => {
      const db = ev.target.result;
      for (const [nombre, cfg] of Object.entries(ALMACENES)) {
        if (db.objectStoreNames.contains(nombre)) continue;
        const st = db.createObjectStore(nombre, { keyPath: cfg.keyPath });
        (cfg.indices || []).forEach(ix => st.createIndex(ix, ix, { unique: false }));
      }
    };
    sol.onsuccess = () => {
      const db = sol.result;
      db.onversionchange = () => { try { db.close(); } catch (e) {} if (_db === db) _db = null; };
      db.onclose = () => { if (_db === db) _db = null; };
      _db = db;
      terminar(resolve, db);
    };
    sol.onerror = () => {
      const e = sol.error;
      terminar(reject, fallo('error-apertura',
        'No se pudo abrir el almacenamiento local' + (e && e.name ? ' (' + e.name + ')' : '') +
        '. Si el navegador está en modo privado o tiene el almacenamiento del sitio bloqueado, los datos no se pueden guardar.'));
    };
    sol.onblocked = () => {
      terminar(reject, fallo('bloqueado',
        'Otra pestaña de la app tiene el almacenamiento abierto. Ciérrala y vuelve a intentarlo.'));
    };
  });
}

/** Abre la base con un reintento automático: Safari a veces falla sólo la primera vez. */
async function abrirDB() {
  if (_db) return _db;
  try {
    return await abrirDBUnaVez(3500);
  } catch (err) {
    if (err.codigo !== 'tiempo-agotado' && err.codigo !== 'error-apertura') throw err;
    if (window.__manna) window.__manna.nota('primer intento de abrir la base falló: ' + err.codigo + ' — ' + err.message);
    await espera(700);
    return await abrirDBUnaVez(4500);
  }
}

/**
 * Safari de iPhone puede cerrar la conexión cuando la app queda en segundo
 * plano. Si la transacción falla por conexión inválida, se reabre una vez.
 */
async function _tx(almacenes, modo) {
  try {
    const db = await abrirDB();
    return db.transaction(almacenes, modo);
  } catch (err) {
    const n = err && err.name;
    if (n === 'InvalidStateError' || n === 'TransactionInactiveError' || n === 'NotFoundError') {
      _db = null;
      const db = await abrirDB();
      return db.transaction(almacenes, modo);
    }
    throw err;
  }
}
function _prom(solicitud) {
  return new Promise((resolve, reject) => {
    solicitud.onsuccess = () => resolve(solicitud.result);
    solicitud.onerror = () => reject(solicitud.error || new Error('Error de almacenamiento'));
  });
}
function _finTx(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('La transacción no se completó'));
    tx.onabort = () => reject(tx.error || new Error('La transacción fue cancelada (puede ser falta de espacio).'));
  });
}

async function dbTodos(almacen) {
  const tx = await _tx([almacen], 'readonly');
  return _prom(tx.objectStore(almacen).getAll());
}
async function dbObtener(almacen, clave) {
  const tx = await _tx([almacen], 'readonly');
  return _prom(tx.objectStore(almacen).get(clave));
}
async function dbPorIndice(almacen, indice, valor) {
  const tx = await _tx([almacen], 'readonly');
  return _prom(tx.objectStore(almacen).index(indice).getAll(valor));
}
async function dbGuardar(almacen, objeto) {
  const tx = await _tx([almacen], 'readwrite');
  tx.objectStore(almacen).put(objeto);
  await _finTx(tx);
  return objeto;
}
async function dbGuardarVarios(almacen, objetos) {
  if (!objetos.length) return true;
  const tx = await _tx([almacen], 'readwrite');
  const st = tx.objectStore(almacen);
  objetos.forEach(o => st.put(o));
  return _finTx(tx);
}
async function dbBorrar(almacen, clave) {
  const tx = await _tx([almacen], 'readwrite');
  tx.objectStore(almacen).delete(clave);
  return _finTx(tx);
}
async function dbBorrarVarios(almacen, claves) {
  if (!claves.length) return true;
  const tx = await _tx([almacen], 'readwrite');
  const st = tx.objectStore(almacen);
  claves.forEach(k => st.delete(k));
  return _finTx(tx);
}
/** Reemplaza el contenido completo de la base (usado sólo al restaurar). */
async function dbReemplazarTodo(contenido) {
  const nombres = Object.keys(ALMACENES);
  const tx = await _tx(nombres, 'readwrite');
  for (const n of nombres) {
    const st = tx.objectStore(n);
    st.clear();
    (contenido[n] || []).forEach(o => st.put(o));
  }
  return _finTx(tx);
}

async function espacioUsado() {
  try {

      const e = await navigator.storage.estimate();
      return { usado: e.usage || 0, disponible: e.quota || 0 };

  return null;

}

/* ===== 40-calc.js ===== */
/* ============================================================
   Cálculos del evento
   Reglas fijas:
   - Todo en centavos enteros.
   - El impuesto y las propinas NUNCA son ganancia.
   - Las comisiones de tarjeta se descuentan UNA sola vez.
   - La caja inicial no es venta ni gasto.
   - Un reembolso no es un gasto nuevo.
   - Si algo no cuadra se muestra la diferencia; no se inventan datos.
   ============================================================ */

/** Divide el importe cobrado de una línea entre venta e impuesto. */
function partirImpuesto(bruto, modo, tasa) {
  if (modo === 'agregado') {
    if (tasa === null || tasa === undefined) return { base: bruto, impuesto: 0, faltaTasa: true };
    const imp = redondear(bruto * tasa / 100);
    return { base: bruto, impuesto: imp, faltaTasa: false };
  }
  if (modo === 'incluido') {
    if (tasa === null || tasa === undefined) return { base: bruto, impuesto: 0, faltaTasa: true };
    const base = redondear(bruto / (1 + tasa / 100));
    return { base: base, impuesto: bruto - base, faltaTasa: false };
  }
  return { base: bruto, impuesto: 0, faltaTasa: false };
}

/** Líneas de venta con sus importes calculados. */
function calcularVentas(evento, ventas) {
  const modo = evento.impuestoModo || 'sin';
  const tasa = (modo === 'sin') ? null : evento.impuestoTasa;
  let base = 0, impuesto = 0, bruto = 0, cobrado = 0, unidades = 0, descuentos = 0, devoluciones = 0, faltaTasa = false;
  const lineas = ventas.map(v => {
    const cant = Number(v.cantidad) || 0;
    const dev = Number(v.devoluciones) || 0;
    const neta = cant - dev;
    const desc = Number(v.descuento) || 0;
    const brutoLinea = (Number(v.precio) || 0) * neta - desc;
    const p = partirImpuesto(brutoLinea, modo, tasa);
    if (p.faltaTasa) faltaTasa = true;
    base += p.base; impuesto += p.impuesto; bruto += brutoLinea; cobrado += p.base + p.impuesto;
    unidades += neta; descuentos += desc; devoluciones += dev;
    return Object.assign({}, v, { neta: neta, bruto: brutoLinea, base: p.base, impuesto: p.impuesto, cobrado: p.base + p.impuesto });
  });
  return { lineas, base, impuesto, bruto, cobrado, unidades, descuentos, devoluciones, faltaTasa };
}

/** Unidades por producto contando el contenido de los combos, sin duplicar ingresos. */
function unidadesPorProducto(ventasCalc, productos) {
  const porId = new Map(productos.map(p => [p.id, p]));
  const cuenta = new Map();
  const suma = (nombre, n) => cuenta.set(nombre, (cuenta.get(nombre) || 0) + n);
  for (const l of ventasCalc.lineas) {
    const prod = l.productoId ? porId.get(l.productoId) : null;
    const contenido = (prod && Array.isArray(prod.combo) && prod.combo.length) ? prod.combo : null;
    if (contenido) {
      for (const c of contenido) {
        const sub = porId.get(c.productoId);
        suma(sub ? sub.nombre : 'Componente eliminado', (Number(c.cantidad) || 0) * l.neta);
      }
    } else {
      suma(l.nombre, l.neta);
    }
  }
  return Array.from(cuenta.entries()).map(([nombre, unidades]) => ({ nombre, unidades }))
    .sort((a, b) => b.unidades - a.unidades);
}

/** Conciliación de caja y cobros. */
function calcularCaja(caja, ventasCalc) {
  const c = caja || {};
  const n = x => Number(x) || 0;
  const tiene = x => x !== null && x !== undefined && x !== '';

  const movEntradas = (c.movimientos || []).filter(m => m.tipo === 'entrada').reduce((s, m) => s + n(m.importe), 0);
  const movSalidas = (c.movimientos || []).filter(m => m.tipo === 'salida').reduce((s, m) => s + n(m.importe), 0);

  const hayEfectivo = tiene(c.efectivoContado);
  const efectivoDeClientes = hayEfectivo
    ? n(c.efectivoContado) - n(c.cajaInicial) - movEntradas + movSalidas
    : 0;
  const ventasEfectivo = hayEfectivo
    ? efectivoDeClientes - n(c.propinasEfectivo) - n(c.impuestosEfectivo)
    : 0;

  const hayTarjeta = tiene(c.tarjetaImporte);
  const comisiones = n(c.comisiones);
  const tarjetaBruto = hayTarjeta ? n(c.tarjetaImporte) + (c.tarjetaYaNeto ? comisiones : 0) : 0;
  const ventasTarjeta = hayTarjeta ? tarjetaBruto - n(c.tarjetaPropinas) - n(c.tarjetaImpuestos) : 0;

  const ventasPorCobros = ventasEfectivo + ventasTarjeta;
  const propinas = n(c.propinasEfectivo) + n(c.tarjetaPropinas);
  const impuestoCobrado = n(c.impuestosEfectivo) + n(c.tarjetaImpuestos);

  return {
    hayEfectivo, hayTarjeta,
    movEntradas, movSalidas,
    efectivoDeClientes, ventasEfectivo,
    tarjetaBruto, ventasTarjeta, comisiones,
    ventasPorCobros,
    propinas, impuestoCobrado,
    diferenciaVentas: ventasPorCobros - ventasCalc.base,
    diferenciaImpuesto: impuestoCobrado - ventasCalc.impuesto,
    cajaInicial: n(c.cajaInicial),
    efectivoEsperadoEnCaja: hayEfectivo ? n(c.efectivoContado) : null
  };
}

/** Saldos de reembolso por persona (dentro del evento). */
function calcularReembolsos(gastos, reembolsos, personas) {
  const nombre = id => {
    const p = personas.find(x => x.id === id);
    return p ? p.nombre : 'Sin asignar';
  };
  const mapa = new Map();
  const tocar = id => {
    if (!mapa.has(id)) mapa.set(id, { personaId: id, nombre: nombre(id), pagado: 0, reembolsado: 0 });
    return mapa.get(id);
  };
  for (const g of gastos) {
    if (g.origen !== 'personal') continue;
    tocar(g.personaId || '').pagado += Number(g.importe) || 0;
  }
  for (const r of reembolsos) {
    tocar(r.personaId || '').reembolsado += Number(r.importe) || 0;
  }
  const filas = Array.from(mapa.values()).map(f => Object.assign(f, { pendiente: f.pagado - f.reembolsado }))
    .sort((a, b) => b.pendiente - a.pendiente);
  return { filas, totalPendiente: filas.reduce((s, f) => s + f.pendiente, 0) };
}

/** Totales de gastos: desembolsado vs atribuible al evento. */
function calcularGastos(gastos) {
  let desembolsado = 0, atribuible = 0, personal = 0, manna = 0, desdeCaja = 0, sinRecibo = 0;
  const porCategoria = new Map();
  const porPersona = new Map();
  for (const g of gastos) {
    const imp = Number(g.importe) || 0;
    const atr = (g.atribuible === null || g.atribuible === undefined) ? imp : (Number(g.atribuible) || 0);
    desembolsado += imp;
    atribuible += atr;
    if (g.origen === 'personal') personal += imp; else manna += imp;
    if (g.desdeCajaEvento) desdeCaja += imp;
    if (!g.numRecibos) sinRecibo++;
    porCategoria.set(g.categoria || 'Otros', (porCategoria.get(g.categoria || 'Otros') || 0) + imp);
    porPersona.set(g.personaId || '', (porPersona.get(g.personaId || '') || 0) + imp);
  }
  return {
    desembolsado, atribuible, personal, manna, desdeCaja, sinRecibo,
    sobrante: desembolsado - atribuible,
    porCategoria: Array.from(porCategoria.entries()).map(([k, v]) => ({ categoria: k, total: v })).sort((a, b) => b.total - a.total),
    porPersona: Array.from(porPersona.entries()).map(([k, v]) => ({ personaId: k, total: v })).sort((a, b) => b.total - a.total)
  };
}

/**
 * Resultado completo del evento.
 * datos = {evento, gastos, ventas, caja, reembolsos, personas, productos}
 */
function calcularEvento(datos) {
  const ventasCalc = calcularVentas(datos.evento, datos.ventas || []);
  const cajaCalc = calcularCaja(datos.caja, ventasCalc);
  const gastosCalc = calcularGastos(datos.gastos || []);
  const reemb = calcularReembolsos(datos.gastos || [], datos.reembolsos || [], datos.personas || []);
  const unidades = unidadesPorProducto(ventasCalc, datos.productos || []);

  const resultado = ventasCalc.base - gastosCalc.atribuible - cajaCalc.comisiones;

  const faltantes = [];
  if ((datos.ventas || []).length === 0) faltantes.push('No hay ventas registradas.');
  if (ventasCalc.faltaTasa) faltantes.push('Falta la tasa de impuesto del evento.');
  if (!cajaCalc.hayEfectivo && !cajaCalc.hayTarjeta) faltantes.push('No se registró el cierre de caja ni los cobros con tarjeta.');
  else {
    if (!cajaCalc.hayEfectivo) faltantes.push('Falta el efectivo contado al cierre.');
    if (!cajaCalc.hayTarjeta) faltantes.push('Faltan los cobros con tarjeta.');
  }
  if (datos.evento.estado !== 'cerrado') faltantes.push('El evento todavía no está cerrado.');

  const alertas = [];
  if ((cajaCalc.hayEfectivo || cajaCalc.hayTarjeta) && cajaCalc.diferenciaVentas !== 0) {
    alertas.push({
      tipo: 'diferencia',
      importe: cajaCalc.diferenciaVentas,
      texto: cajaCalc.diferenciaVentas > 0
        ? 'Se cobró más de lo que suman los productos registrados. Revisa si falta registrar ventas, o si hay propinas o impuestos incluidos en los cobros que no se separaron.'
        : 'Los productos registrados suman más de lo cobrado. Revisa cantidades, descuentos, cortesías, o si falta registrar un cobro.'
    });
  }
  if (cajaCalc.diferenciaImpuesto !== 0 && (datos.evento.impuestoModo || 'sin') !== 'sin' && cajaCalc.impuestoCobrado !== 0) {
    alertas.push({
      tipo: 'impuesto',
      importe: cajaCalc.diferenciaImpuesto,
      texto: 'El impuesto reportado por el cobro no coincide con el impuesto estimado sobre las ventas registradas.'
    });
  }
  if (reemb.totalPendiente > 0) {
    alertas.push({ tipo: 'reembolso', importe: reemb.totalPendiente, texto: 'Hay dinero personal pendiente de reembolsar.' });
  }
  if (gastosCalc.sinRecibo > 0) {
    alertas.push({ tipo: 'recibo', importe: null, texto: plural(gastosCalc.sinRecibo, 'gasto', 'gastos') + ' sin recibo adjunto.' });
  }

  return {
    ventas: ventasCalc,
    caja: cajaCalc,
    gastos: gastosCalc,
    reembolsos: reemb,
    unidades,
    resultado,
    provisional: faltantes.length > 0 || (cajaCalc.diferenciaVentas !== 0 && (cajaCalc.hayEfectivo || cajaCalc.hayTarjeta)),
    faltantes,
    alertas
  };
}

/** Carga de la base todo lo necesario para calcular un evento. */
async function cargarEvento(eventoId) {
  const [evento, gastos, ventas, caja, reembolsos, personas, productos] = await Promise.all([
    dbObtener('eventos', eventoId),
    dbPorIndice('gastos', 'eventoId', eventoId),
    dbPorIndice('ventas', 'eventoId', eventoId),
    dbObtener('caja', eventoId),
    dbPorIndice('reembolsos', 'eventoId', eventoId),
    dbTodos('personas'),
    dbTodos('productos')
  ]);
  if (!evento) return null;
  gastos.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.creado - a.creado);
  ventas.sort((a, b) => (a.creado || 0) - (b.creado || 0));
  return {
    evento, gastos, ventas,
    caja: caja || nuevaCaja(eventoId),
    reembolsos, personas, productos
  };
}

    (g.sobrante !== 0 ? fila('Queda para otros eventos', dinero(g.sobrante), 'Material comprado que no se consumió aquí') : '') +
    fila('Pagado con dinero personal', dinero(g.personal)) +
    '</div>';

  html += '<div class="seccion"><h2>' + plural(lista.length, 'gasto') + '</h2><ul class="lista">' +
    lista.map(x => {
      const parcial = (x.atribuible !== null && x.atribuible !== undefined && x.atribuible !== x.importe);
      return '<li><button class="fila" data-accion="editar-gasto" data-id="' + esc(x.id) + '">' +
        '<div class="cuerpo"><div class="t">' + esc(x.concepto || 'Sin concepto') + '</div>' +
        '<div class="s">' + esc(x.categoria) + ' · ' + esc(fechaCorta(x.fecha)) + ' · ' + esc(nombrePersona(datos, x.personaId)) + '</div>' +
        '<div class="s" style="margin-top:4px">' +
        '<span class="etiqueta-origen' + (x.origen === 'personal' ? ' personal' : '') + '">' + (x.origen === 'personal' ? 'Dinero personal' : 'Dinero de MANNA') + '</span>' +
        (x.numRecibos ? ' <span class="etiqueta-origen">📎 ' + x.numRecibos + '</span>' : ' <span class="etiqueta-origen">sin recibo</span>') +
        (parcial ? ' <span class="etiqueta-origen">parcial: ' + esc(dineroPlano(x.atribuible)) + '</span>' : '') +
        (x.desdeCajaEvento ? ' <span class="etiqueta-origen">desde caja</span>' : '') +
        '</div></div>' +
        '<div class="monto">' + dinero(x.importe) + '</div>' +
        '<span class="chevron" aria-hidden="true">›</span></button></li>';
    }).join('') + '</ul></div>';

  html += '<div class="seccion"><h2>Totales por categoría</h2><div class="filas-num">' +
    g.porCategoria.map(c => fila(c.categoria, dinero(c.total))).join('') + '</div></div>';

  html += '<div class="seccion"><h2>Totales por persona</h2><div class="filas-num">' +
    g.porPersona.map(p => fila(nombrePersona(datos, p.personaId), dinero(p.total))).join('') + '</div></div>';

  return html + '</div>';
}

function fila(k, v, sub, clase) {
  return '<div class="n' + (clase ? ' ' + clase : '') + '"><div class="k">' + esc(k) +
    (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><div class="v">' + v + '</div></div>';
}

/* ---------- Formulario de gasto ---------- */
function abrirGasto(gasto) {
  const datos = estado.datos;
  const esNuevo = !gasto;
  const g = gasto || {
    id: null, importe: null, concepto: '', categoria: CONFIG.categorias[0], personaId: '',
    origen: 'manna', fecha: hoyISO(), notas: '', atribuible: null, desdeCajaEvento: false, numRecibos: 0
  };
  let recibosActuales = [];
  const pendientes = [];      // nuevos archivos por guardar
  const aBorrar = [];         // ids de recibos a eliminar
  const urls = [];

  const h = hoja({
    titulo: esNuevo ? 'Nuevo gasto' : 'Editar gasto',
    guardar: esNuevo ? 'Guardar gasto' : 'Guardar cambios',
    alCerrar() { urls.forEach(u => URL.revokeObjectURL(u)); },
    render(cuerpo) {
      cuerpo.innerHTML = plantillaGasto(datos, g, esNuevo);
      conectarGasto(cuerpo, datos, g, recibosActuales, pendientes, aBorrar, urls);
      if (!esNuevo) {
        dbPorIndice('recibos', 'gastoId', g.id).then(rs => {
          recibosActuales.length = 0; rs.forEach(r => recibosActuales.push(r));
          dibujarRecibos(cuerpo, recibosActuales, pendientes, aBorrar, urls);
        });
      }
      setTimeout(() => { const i = cuerpo.querySelector('#g-importe'); if (i) i.focus(); }, 60);
    },
    async alGuardar(cuerpo) {
      const importe = aCentavos(cuerpo.querySelector('#g-importe').value);
      if (importe === null || importe <= 0) { tostada('Escribe el importe del gasto.', 'malo'); return false; }
      const concepto = cuerpo.querySelector('#g-concepto').value.trim();
      if (!concepto) { tostada('Escribe qué se compró.', 'malo'); return false; }
      const parcial = cuerpo.querySelector('#g-parcial').checked;
      let atribuible = importe;
      if (parcial) {
        const a = aCentavos(cuerpo.querySelector('#g-atribuible').value);
        if (a === null || a < 0) { tostada('Escribe cuánto corresponde a este evento.', 'malo'); return false; }
        if (a > importe) { tostada('La parte de este evento no puede superar el importe del gasto.', 'malo'); return false; }
        atribuible = a;
      }
      const origen = cuerpo.querySelector('[data-origen][aria-pressed="true"]').dataset.origen;
      const registro = {
        id: g.id || nuevoId('ga'),
        eventoId: datos.evento.id,
        importe: importe,
        concepto: concepto,
        categoria: cuerpo.querySelector('#g-categoria').value,
        personaId: cuerpo.querySelector('#g-persona').value,
        origen: origen,
        fecha: cuerpo.querySelector('#g-fecha').value || hoyISO(),
        notas: cuerpo.querySelector('#g-notas').value.trim(),
        atribuible: atribuible,
        desdeCajaEvento: origen === 'manna' && cuerpo.querySelector('#g-caja').checked,
        numRecibos: 0,
        creado: g.creado || Date.now(),
        actualizado: Date.now()
      };

      if (aBorrar.length) await dbBorrarVarios('recibos', aBorrar);
      if (pendientes.length) {
        await dbGuardarVarios('recibos', pendientes.map(p => ({
          id: p.id, gastoId: registro.id, eventoId: registro.eventoId,
          nombre: p.nombre, mime: p.mime, tamano: p.tamano, archivo: p.blob, creado: Date.now()
        })));
      }
      const rs = await dbPorIndice('recibos', 'gastoId', registro.id);
      registro.numRecibos = rs.length;
      await dbGuardar('gastos', registro);
      await sincronizarSalidaCaja(registro);
      tostada(esNuevo ? 'Gasto guardado' : 'Gasto actualizado');
      pintar();
      return true;
    }
  });

  if (!esNuevo) {
    const pie = h.fondo.querySelector('.hoja-pie');
    const borrar = document.createElement('button');
    borrar.className = 'btn peligro';
    borrar.style.flex = '0 0 auto';
    borrar.textContent = 'Eliminar';
    borrar.onclick = async () => {
      const ok = await confirmar({
        titulo: 'Eliminar gasto',
        texto: 'Se eliminará "' + (g.concepto || 'este gasto') + '" y sus recibos adjuntos. Esta acción no se puede deshacer.',
        ok: 'Eliminar', peligro: true
      });
      if (!ok) return;
      const rs = await dbPorIndice('recibos', 'gastoId', g.id);
      await dbBorrarVarios('recibos', rs.map(r => r.id));
      await dbBorrar('gastos', g.id);
      await sincronizarSalidaCaja({ id: g.id, desdeCajaEvento: false, eventoId: datos.evento.id });
      tostada('Gasto eliminado');
      h.cerrar();
      pintar();
    };
    pie.insertBefore(borrar, pie.firstChild);
  }
}

  return '' +
    '<div class="campo"><label for="g-importe">Importe</label>' +
    '<div class="campo-dinero"><span class="signo">$</span>' +
    '<input type="text" inputmode="decimal" id="g-importe" value="' + esc(dineroCampo(g.importe)) + '" placeholder="0.00" autocomplete="off"></div></div>' +

    '<div class="campo"><label for="g-concepto">¿Qué se compró?</label>' +
    '<input type="text" id="g-concepto" value="' + esc(g.concepto) + '" placeholder="Ej.: Harina y huevos" autocomplete="off"></div>' +

    '<div class="grid-2 apila">' +
    '<div class="campo"><label for="g-categoria">Categoría</label><select id="g-categoria">' +
    cats.map(c => '<option value="' + esc(c) + '"' + (g.categoria === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
    '</select></div>' +
    '<div class="campo"><label for="g-fecha">Fecha</label><input type="date" id="g-fecha" value="' + esc((g.fecha || hoyISO()).slice(0, 10)) + '"></div>' +
    '</div>' +

    '<div class="campo"><label for="g-persona">¿Quién pagó?</label>' +
    '<select id="g-persona">' +
    '<option value="">Sin asignar</option>' +
    datos.personas.map(p => '<option value="' + esc(p.id) + '"' + (g.personaId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') +
    '<option value="__nueva">＋ Agregar persona…</option>' +
    '</select>' +
    '<div class="ayuda">Quién pagó y qué se compró son datos distintos: el concepto va arriba.</div></div>' +

    '<div class="campo"><span class="rotulo">¿De dónde salió el dinero?</span>' +
    '<div class="segmentado" id="g-origen">' +
    '<button type="button" data-origen="manna" aria-pressed="' + (g.origen !== 'personal') + '">De MANNA</button>' +

    '</div>' +
    '<div class="ayuda" id="g-origen-ayuda"></div></div>' +

    '<div id="g-caja-caja"' + (g.origen === 'personal' ? ' hidden' : '') + '>' +

    '<span class="txt">Se pagó con el efectivo de la caja del evento' +
    '<small>Se registra como salida de caja ligada a este gasto. No se cuenta dos veces.</small></span></label></div>' +

    '<label class="interruptor"><input type="checkbox" id="g-parcial"' + (parcial ? ' checked' : '') + '>' +
    '<span class="txt">Sólo una parte se usó en este evento' +
    '<small>El resto queda disponible para otros eventos y no se cuenta como costo aquí.</small></span></label>' +
    '<div class="campo" id="g-parcial-caja"' + (parcial ? '' : ' hidden') + '>' +
    '<label for="g-atribuible">Parte que corresponde a este evento</label>' +
    '<div class="campo-dinero"><span class="signo">$</span>' +
    '<input type="text" inputmode="decimal" id="g-atribuible" value="' + esc(parcial ? dineroCampo(g.atribuible) : '') + '" placeholder="0.00"></div></div>' +

    '<div class="campo"><span class="rotulo">Recibos</span>' +

    '<div class="recibos" id="g-recibos"></div>' +
    '<div class="ayuda">Se guarda el archivo original. Los recibos entran en el respaldo.' + (esNuevo ? ' Se adjuntan al guardar el gasto.' : '') + '</div></div>' +

    '<div class="campo"><label for="g-notas">Notas (opcional)</label>' +

function conectarGasto(cuerpo, datos, g, recibosActuales, pendientes, aBorrar, urls) {
  const seg = cuerpo.querySelector('#g-origen');
  const ayuda = cuerpo.querySelector('#g-origen-ayuda');
  const cajaCaja = cuerpo.querySelector('#g-caja-caja');
  const pintarOrigen = () => {
    const personal = seg.querySelector('[data-origen="personal"]').getAttribute('aria-pressed') === 'true';
    ayuda.textContent = personal
      ? 'Se registrará como dinero que MANNA le debe a esa persona hasta reembolsarlo.'
      : 'Dinero de MANNA: no genera reembolso.';
    cajaCaja.hidden = personal;
    if (personal) cuerpo.querySelector('#g-caja').checked = false;
  };
  seg.addEventListener('click', e => {
    const b = e.target.closest('[data-origen]');
    if (!b) return;
    seg.querySelectorAll('[data-origen]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    pintarOrigen();
  });
  pintarOrigen();

  const parcial = cuerpo.querySelector('#g-parcial');
  parcial.addEventListener('change', () => {
    cuerpo.querySelector('#g-parcial-caja').hidden = !parcial.checked;
    if (parcial.checked) {
      const campo = cuerpo.querySelector('#g-atribuible');
      if (!campo.value) campo.value = dineroCampo(aCentavos(cuerpo.querySelector('#g-importe').value) || 0);
      campo.focus();
    }
  });

  const selP = cuerpo.querySelector('#g-persona');
  selP.addEventListener('change', async () => {
    if (selP.value !== '__nueva') return;
    selP.value = g.personaId || '';
    const nombre = await pedirTexto('Nueva persona', 'Nombre', '');
    if (!nombre) return;
    const persona = { id: nuevoId('pe'), nombre: nombre, creado: Date.now() };
    await dbGuardar('personas', persona);
    datos.personas.push(persona);
    const opt = document.createElement('option');
    opt.value = persona.id; opt.textContent = persona.nombre;
    selP.insertBefore(opt, selP.querySelector('[value="__nueva"]'));
    selP.value = persona.id;
  });

  const camara = cuerpo.querySelector('#g-input-camara');
  const archivo = cuerpo.querySelector('#g-input-archivo');
  cuerpo.querySelector('#g-camara').onclick = () => camara.click();
  cuerpo.querySelector('#g-archivo').onclick = () => archivo.click();
  const recibir = ev => {
    const archivos = Array.from(ev.target.files || []);
    for (const f of archivos) {
      pendientes.push({ id: nuevoId('re'), nombre: f.name || ('recibo-' + selloArchivo() + '.jpg'), mime: f.type || 'application/octet-stream', tamano: f.size, blob: f });
    }
    ev.target.value = '';
    dibujarRecibos(cuerpo, recibosActuales, pendientes, aBorrar, urls);
  };
  camara.addEventListener('change', recibir);
  archivo.addEventListener('change', recibir);
  dibujarRecibos(cuerpo, recibosActuales, pendientes, aBorrar, urls);
}

function dibujarRecibos(cuerpo, actuales, pendientes, aBorrar, urls) {
  const cont = cuerpo.querySelector('#g-recibos');
  if (!cont) return;
  const items = actuales.filter(r => !aBorrar.includes(r.id))
    .map(r => ({ id: r.id, nombre: r.nombre, mime: r.mime, blob: r.archivo, guardado: true }))
    .concat(pendientes.map(p => ({ id: p.id, nombre: p.nombre, mime: p.mime, blob: p.blob, guardado: false })));
  if (!items.length) { cont.innerHTML = '<div style="font-size:13px;color:var(--texto-suave)">Sin recibos adjuntos.</div>'; return; }
  cont.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'recibo';
    if (it.mime && it.mime.indexOf('image/') === 0) {
      const url = URL.createObjectURL(it.blob); urls.push(url);
      el.innerHTML = '<img alt="' + esc(it.nombre) + '" src="' + url + '">';
    } else {
      el.innerHTML = '<div class="doc">📄<br>' + esc((it.nombre || '').slice(0, 22)) + '</div>';
    }
    const quitar = document.createElement('button');
    quitar.className = 'quitar'; quitar.type = 'button'; quitar.textContent = '✕';
    quitar.setAttribute('aria-label', 'Quitar recibo');
    quitar.onclick = async e => {
      e.stopPropagation();
      const ok = await confirmar({ titulo: 'Quitar recibo', texto: 'Se quitará "' + it.nombre + '" al guardar el gasto.', ok: 'Quitar', peligro: true });
      if (!ok) return;
      if (it.guardado) aBorrar.push(it.id);
      else { const i = pendientes.findIndex(p => p.id === it.id); if (i >= 0) pendientes.splice(i, 1); }
      dibujarRecibos(cuerpo, actuales, pendientes, aBorrar, urls);
    };
    el.appendChild(quitar);
    el.onclick = () => verRecibo(it);
    cont.appendChild(el);
  });
}

function verRecibo(item) {
  const capa = document.createElement('div');
  capa.className = 'visor';
  const esImagen = item.mime && item.mime.indexOf('image/') === 0;
  const url = URL.createObjectURL(item.blob);
  capa.innerHTML =
    '<div class="visor-top"><div class="nom">' + esc(item.nombre) + '</div>' +
    '<button class="cerrar" aria-label="Cerrar">✕</button></div>' +
    (esImagen ? '<img alt="' + esc(item.nombre) + '" src="' + url + '">'
      : '<div style="flex:1;display:grid;place-items:center;color:#fff;padding:24px;text-align:center">📄<br>' + esc(item.nombre) + '<br><small>Este tipo de archivo se abre al guardarlo.</small></div>') +
    '<div class="visor-pie"><button class="btn secundario" data-guardar style="flex:1">Guardar o compartir</button></div>';
  const cerrar = () => { capa.remove(); URL.revokeObjectURL(url); };
  capa.querySelector('.cerrar').onclick = cerrar;
  capa.querySelector('[data-guardar]').onclick = async () => {
    try {
      const r = await entregarArchivo(item.nombre || 'recibo', item.blob);
      if (r.via === 'cancelado') return;
      tostada('Archivo entregado');
    } catch (err) {
      tostada(err && err.message ? err.message : 'No se pudo entregar el archivo', 'malo');
    }
  };
  $('#capas').appendChild(capa);
}

async function verRecibosDeGasto(gastoId) {
  const rs = await dbPorIndice('recibos', 'gastoId', gastoId);
  if (!rs.length) { tostada('Ese gasto no tiene recibos.'); return; }
  verRecibo({ id: rs[0].id, nombre: rs[0].nombre, mime: rs[0].mime, blob: rs[0].archivo });
}

/** Mantiene la salida de caja ligada al gasto sin duplicar el gasto. */
async function sincronizarSalidaCaja(gasto) {
  const caja = (await dbObtener('caja', gasto.eventoId)) || nuevaCaja(gasto.eventoId);
  caja.movimientos = (caja.movimientos || []).filter(m => m.gastoId !== gasto.id);
  if (gasto.desdeCajaEvento) {
    caja.movimientos.push({
      id: nuevoId('mv'), tipo: 'salida', importe: gasto.importe,
      motivo: 'Gasto: ' + (gasto.concepto || 'sin concepto'), gastoId: gasto.id
    });
  }
  await dbGuardar('caja', caja);
}

/** Pequeño diálogo de texto. */
function pedirTexto(titulo, rotulo, valor) {
  return new Promise(resolve => {
    let resuelto = false;
    const h = hoja({
      titulo: titulo, guardar: 'Guardar',
      alCerrar() { if (!resuelto) resolve(null); },
      render(c) {
        c.innerHTML = '<div class="campo"><label for="txt-uno">' + esc(rotulo) + '</label>' +
          '<input type="text" id="txt-uno" value="' + esc(valor || '') + '" autocomplete="off"></div>';
        setTimeout(() => c.querySelector('#txt-uno').focus(), 60);
      },
      alGuardar(c) {
        const v = c.querySelector('#txt-uno').value.trim();
        if (!v) { tostada('Escribe un nombre.', 'malo'); return false; }
        resuelto = true; resolve(v); return true;
      }
    });
    return h;
  });
}

const TIPOS_PRODUCTO = { combo: 'Combo', individual: 'Producto individual', bebida: 'Bebida', extra: 'Extra' };

      '<td class="num">' + l.neta + '</td>' +
      '<td class="num">' + dineroPlano(l.cobrado) + '</td>' +
      '</tr>').join('') +
    '</tbody><tfoot><tr><td colspan="3">Total cobrado por productos</td><td class="num">' + dineroPlano(v.cobrado) + '</td></tr></tfoot></table></div>';

  html += '<div class="seccion" style="margin-top:16px"><h2>Totales</h2><div class="filas-num">' +

    html += '<div class="seccion"><h2>Unidades por producto (combos desglosados)</h2><div class="filas-num">' +
      calc.unidades.map(u => fila(u.nombre, String(u.unidades))).join('') + '</div>' +
      '<p class="nota-pie">Los combos se desglosan para contar unidades; el ingreso se cuenta una sola vez, en el combo.</p></div>';
  }

  return html + '</div>';
}

function abrirVenta(venta) {
  const datos = estado.datos;
  const esNuevo = !venta;
  const v = venta || { id: null, productoId: '', nombre: '', tipo: 'individual', precio: null, cantidad: 1, devoluciones: 0, descuento: 0 };

  const h = hoja({
    titulo: esNuevo ? 'Producto vendido' : 'Editar venta',
    guardar: 'Guardar',
    render(cuerpo) {
      cuerpo.innerHTML = '' +
        (datos.productos.length
          ? '<div class="campo"><label for="v-catalogo">Elegir del catálogo</label><select id="v-catalogo">' +
            '<option value="">Escribir manualmente…</option>' +
            datos.productos.filter(p => p.activo !== false).map(p =>
              '<option value="' + esc(p.id) + '"' + (v.productoId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + ' — ' + dineroPlano(p.precio) + '</option>').join('') +
            '</select></div>'
          : '<div class="aviso info" style="margin-bottom:14px">Guarda tus productos en Ajustes → Catálogo para elegirlos con un toque.</div>') +

        '<div class="campo"><label for="v-nombre">Producto</label>' +
        '<input type="text" id="v-nombre" value="' + esc(v.nombre) + '" placeholder="Ej.: Combo crepe + café" autocomplete="off"></div>' +

        '<div class="grid-2 apila">' +
        '<div class="campo"><label for="v-tipo">Tipo</label><select id="v-tipo">' +
        Object.entries(TIPOS_PRODUCTO).map(([k, t]) => '<option value="' + k + '"' + (v.tipo === k ? ' selected' : '') + '>' + t + '</option>').join('') +
        '</select></div>' +
        '<div class="campo"><label for="v-precio">Precio de venta</label>' +
        '<div class="campo-dinero"><span class="signo">$</span><input type="text" inputmode="decimal" id="v-precio" value="' + esc(dineroCampo(v.precio)) + '" placeholder="0.00"></div></div>' +
        '</div>' +
        '<div class="ayuda" style="margin:-6px 0 14px">Se guarda el precio usado en este evento, aunque después cambie el catálogo.</div>' +

        '<div class="grid-2">' +
        '<div class="campo"><label for="v-cantidad">Cantidad vendida</label><input type="number" inputmode="numeric" id="v-cantidad" min="0" step="1" value="' + esc(v.cantidad) + '"></div>' +
        '<div class="campo"><label for="v-devoluciones">Devoluciones</label><input type="number" inputmode="numeric" id="v-devoluciones" min="0" step="1" value="' + esc(v.devoluciones || 0) + '"></div>' +
        '</div>' +

        '<div class="campo"><label for="v-descuento">Descuentos aplicados (total)</label>' +
        '<div class="campo-dinero"><span class="signo">$</span><input type="text" inputmode="decimal" id="v-descuento" value="' + esc(v.descuento ? dineroCampo(v.descuento) : '') + '" placeholder="0.00"></div>' +
        '<div class="ayuda">Importe total descontado en este producto durante el evento.</div></div>' +

        '<div class="filas-num" id="v-vista"></div>';

      const cat = cuerpo.querySelector('#v-catalogo');
      if (cat) cat.addEventListener('change', () => {
        const p = datos.productos.find(x => x.id === cat.value);
        if (!p) return;
        cuerpo.querySelector('#v-nombre').value = p.nombre;
        cuerpo.querySelector('#v-tipo').value = p.tipo || 'individual';
        cuerpo.querySelector('#v-precio').value = dineroCampo(p.precio);
        actualizar();
      });
      const actualizar = () => {
        const precio = aCentavos(cuerpo.querySelector('#v-precio').value) || 0;
        const cant = Number(cuerpo.querySelector('#v-cantidad').value) || 0;
        const dev = Number(cuerpo.querySelector('#v-devoluciones').value) || 0;
        const desc = aCentavos(cuerpo.querySelector('#v-descuento').value) || 0;
        const bruto = precio * (cant - dev) - desc;
        const modo = datos.evento.impuestoModo || 'sin';
        const p = partirImpuesto(bruto, modo, modo === 'sin' ? null : datos.evento.impuestoTasa);
        cuerpo.querySelector('#v-vista').innerHTML =
          fila('Importe cobrado', dinero(p.base + p.impuesto)) +
          (modo !== 'sin' ? fila('Impuesto', dinero(p.impuesto)) : '') +
          fila('Venta sin impuesto', dinero(p.base), null, 'total');
      };
      ['#v-precio', '#v-cantidad', '#v-devoluciones', '#v-descuento'].forEach(s =>
        cuerpo.querySelector(s).addEventListener('input', actualizar));
      actualizar();
      setTimeout(() => cuerpo.querySelector('#v-nombre').focus(), 60);
    },
    async alGuardar(cuerpo) {
      const nombre = cuerpo.querySelector('#v-nombre').value.trim();
      if (!nombre) { tostada('Escribe el nombre del producto.', 'malo'); return false; }
      const precio = aCentavos(cuerpo.querySelector('#v-precio').value);
      if (precio === null || precio < 0) { tostada('Escribe el precio de venta.', 'malo'); return false; }
      const cantidad = Math.max(0, Math.floor(Number(cuerpo.querySelector('#v-cantidad').value) || 0));
      const devoluciones = Math.max(0, Math.floor(Number(cuerpo.querySelector('#v-devoluciones').value) || 0));
      if (devoluciones > cantidad) { tostada('Las devoluciones no pueden superar la cantidad vendida.', 'malo'); return false; }
      const cat = cuerpo.querySelector('#v-catalogo');
      await dbGuardar('ventas', {
        id: v.id || nuevoId('ve'),
        eventoId: datos.evento.id,
        productoId: cat ? cat.value : '',
        nombre: nombre,
        tipo: cuerpo.querySelector('#v-tipo').value,
        precio: precio,
        cantidad: cantidad,
        devoluciones: devoluciones,
        descuento: aCentavos(cuerpo.querySelector('#v-descuento').value) || 0,
        creado: v.creado || Date.now(),
        actualizado: Date.now()
      });
      tostada('Venta guardada');
      pintar();
      return true;
    }
  });

  if (!esNuevo) {
    const pie = h.fondo.querySelector('.hoja-pie');
    const b = document.createElement('button');
    b.className = 'btn peligro'; b.style.flex = '0 0 auto'; b.textContent = 'Eliminar';
    b.onclick = async () => {
      const ok = await confirmar({ titulo: 'Eliminar venta', texto: 'Se eliminará "' + v.nombre + '" de este evento.', ok: 'Eliminar', peligro: true });
      if (!ok) return;
      await dbBorrar('ventas', v.id);
      tostada('Venta eliminada'); h.cerrar(); pintar();
    };
    pie.insertBefore(b, pie.firstChild);
  }
}

/* ============================================================

   ============================================================ */
function vistaCaja(datos, calc) {
  const c = datos.caja;
  const k = calc.caja;
  const hay = k.hayEfectivo || k.hayTarjeta;

  let html = '<div class="envoltura">' +
    '<div class="acciones" style="margin-bottom:16px">' +
    '<button class="btn" data-accion="editar-caja">Registrar caja y cobros</button>' +
    '<button class="btn secundario" data-accion="nuevo-movimiento">＋ Entrada o salida</button>' +
    '</div>';

  if (!hay) {
    html += '<div class="vacio">' + icono('caja', 40) + '<h3>Caja sin registrar</h3>' +
      '<p>Al cerrar el evento anota la caja inicial, el efectivo contado y los cobros con tarjeta. La caja inicial no es una venta.</p></div></div>';
    return html;
  }

  html += '<div class="seccion"><h2>Efectivo</h2><div class="filas-num">' +
    fila('Caja inicial para cambio', dinero(k.cajaInicial), 'No es venta ni gasto') +
    fila('Efectivo contado al cierre', k.hayEfectivo ? dinero(c.efectivoContado) : 'Falta') +
    (k.movEntradas ? fila('Otras entradas de efectivo', '−' + dineroPlano(k.movEntradas), 'No provienen de ventas') : '') +
    (k.movSalidas ? fila('Salidas de efectivo', '+' + dineroPlano(k.movSalidas), 'Se devuelven al cálculo de lo cobrado') : '') +
    fila('Efectivo recibido de clientes', dinero(k.efectivoDeClientes), null, 'total') +
    (c.propinasEfectivo ? fila('Menos propinas en efectivo', '−' + dineroPlano(c.propinasEfectivo)) : '') +
    (c.impuestosEfectivo ? fila('Menos impuesto cobrado en efectivo', '−' + dineroPlano(c.impuestosEfectivo)) : '') +
    fila('Ventas en efectivo sin impuesto', dinero(k.ventasEfectivo), null, 'total') +
    '</div></div>';

  html += '<div class="seccion"><h2>Tarjeta</h2><div class="filas-num">' +
    fila('Importe registrado', k.hayTarjeta ? dinero(c.tarjetaImporte) : 'Falta',
      c.tarjetaYaNeto ? 'Ya tiene descontadas las comisiones' : 'Bruto, antes de comisiones') +
    (c.tarjetaYaNeto && k.comisiones ? fila('Comisiones devueltas al bruto', '+' + dineroPlano(k.comisiones)) : '') +
    fila('Cobro bruto con tarjeta', dinero(k.tarjetaBruto)) +
    (c.tarjetaPropinas ? fila('Menos propinas con tarjeta', '−' + dineroPlano(c.tarjetaPropinas)) : '') +
    (c.tarjetaImpuestos ? fila('Menos impuesto cobrado con tarjeta', '−' + dineroPlano(c.tarjetaImpuestos)) : '') +
    fila('Ventas con tarjeta sin impuesto', dinero(k.ventasTarjeta), null, 'total') +
    (k.comisiones ? fila('Comisiones de cobro', dinero(k.comisiones), 'Se descuentan una sola vez en el resultado') : '') +
    '</div></div>';

  const dif = k.diferenciaVentas;
  html += '<div class="seccion"><h2>Conciliación</h2><div class="filas-num">' +
    fila('Ventas según productos', dinero(calc.ventas.base)) +
    fila('Ventas según cobros', dinero(k.ventasPorCobros)) +
    fila('Diferencia', (dif > 0 ? '+' : '') + dinero(dif), null, dif === 0 ? 'total' : (dif > 0 ? 'total pos' : 'total neg')) +
    '</div>';

  if (dif !== 0) {
    const a = calc.alertas.find(x => x.tipo === 'diferencia');
    html += '<div class="aviso alerta" style="margin-top:10px"><strong>Hay ' + dinero(Math.abs(dif)) + ' de diferencia</strong>' +
      esc(a ? a.texto : '') + '<ul>' +
      '<li>Comprueba que las cantidades vendidas estén completas.</li>' +
      '<li>Revisa que propinas e impuestos estén separados de los cobros.</li>' +
      '<li>Revisa entradas y salidas de efectivo no registradas.</li>' +
      '</ul>La app no ajusta los números por su cuenta.</div>';
  } else {
    html += '<div class="aviso bueno" style="margin-top:10px"><strong>Los cobros cuadran con los productos</strong>No hay diferencia por aclarar.</div>';
  }

  if ((datos.evento.impuestoModo || 'sin') !== 'sin') {
    html += '<div class="filas-num" style="margin-top:12px">' +
      fila('Impuesto estimado sobre ventas', dinero(calc.ventas.impuesto)) +
      fila('Impuesto reportado por el cobro', dinero(k.impuestoCobrado)) +
      fila('Diferencia de impuesto', (k.diferenciaImpuesto > 0 ? '+' : '') + dinero(k.diferenciaImpuesto), null,
        k.diferenciaImpuesto === 0 ? 'total' : 'total neg') +
      '</div>';
  }
  html += '</div>';

  const movs = (c.movimientos || []);
  html += '<div class="seccion"><h2>Entradas y salidas de caja</h2>';
  if (!movs.length) html += '<div class="aviso info">Sin movimientos adicionales registrados.</div>';
  else html += '<ul class="lista">' + movs.map(m =>
    '<li><div class="fila" style="cursor:default"><div class="cuerpo"><div class="t">' + esc(m.motivo || (m.tipo === 'entrada' ? 'Entrada' : 'Salida')) + '</div>' +
    '<div class="s">' + (m.tipo === 'entrada' ? 'Entrada de efectivo' : 'Salida de efectivo') +
    (m.gastoId ? ' · ligada a un gasto ya registrado' : '') + '</div></div>' +
    '<div class="monto">' + (m.tipo === 'entrada' ? '+' : '−') + dineroPlano(m.importe) + '</div>' +
    (m.gastoId ? '' : '<button class="btn fantasma chico" data-accion="borrar-movimiento" data-id="' + esc(m.id) + '">Quitar</button>') +
    '</div></li>').join('') + '</ul>';
  html += '<p class="nota-pie">Las salidas para pagar gastos se crean solas cuando marcas un gasto como pagado con la caja del evento. No se cuentan dos veces.</p></div>';

  return html + '</div>';
}

    render(cuerpo) {

      cuerpo.innerHTML =

        campoD('c-contado', 'Efectivo contado al cierre', c.efectivoContado, 'Todo el efectivo que hay en la caja al terminar, incluida la caja inicial.') +
        campoD('c-propinas', 'Propinas en efectivo incluidas en ese conteo', c.propinasEfectivo, 'Se muestran aparte del resultado operativo.') +
        campoD('c-impuestos', 'Impuesto cobrado en efectivo', c.impuestosEfectivo, 'Impuesto real reportado, no estimado.') +
        '<hr class="sep">' +
        '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--texto-suave);margin:0 0 10px">Tarjeta</h3>' +
        campoD('c-tarjeta', 'Cobros con tarjeta', c.tarjetaImporte) +
        '<label class="interruptor"><input type="checkbox" id="c-neto"' + (c.tarjetaYaNeto ? ' checked' : '') + '>' +
        '<span class="txt">Ese importe ya tiene descontadas las comisiones' +
        '<small>Si lo marcas, la app devuelve las comisiones al bruto y las descuenta una sola vez.</small></span></label>' +
        campoD('c-tpropinas', 'Propinas con tarjeta', c.tarjetaPropinas) +
        campoD('c-timpuestos', 'Impuesto cobrado con tarjeta', c.tarjetaImpuestos) +
        campoD('c-comisiones', 'Comisiones de tarjeta', c.comisiones);
    },
    async alGuardar(cuerpo) {
      const val = id => aCentavos(cuerpo.querySelector('#' + id).value);
      const caja = Object.assign({}, c, {
        eventoId: datos.evento.id,
        cajaInicial: val('c-inicial'),
        efectivoContado: val('c-contado'),
        propinasEfectivo: val('c-propinas'),
        impuestosEfectivo: val('c-impuestos'),
        tarjetaImporte: val('c-tarjeta'),
        tarjetaYaNeto: cuerpo.querySelector('#c-neto').checked,
        tarjetaPropinas: val('c-tpropinas'),
        tarjetaImpuestos: val('c-timpuestos'),
        comisiones: val('c-comisiones')
      });
      await dbGuardar('caja', caja);
      tostada('Caja guardada');
      pintar();
      return true;
    }
  });
}

function abrirMovimiento() {
  const datos = estado.datos;
  hoja({
    titulo: 'Entrada o salida de caja',
    guardar: 'Agregar',
    render(cuerpo) {
      cuerpo.innerHTML =
        '<div class="campo"><span class="rotulo">Tipo</span><div class="segmentado" id="m-tipo">' +
        '<button type="button" data-tipo="salida" aria-pressed="true">Salida</button>' +
        '<button type="button" data-tipo="entrada" aria-pressed="false">Entrada</button></div></div>' +
        '<div class="campo"><label for="m-importe">Importe</label>' +
        '<div class="campo-dinero"><span class="signo">$</span><input type="text" inputmode="decimal" id="m-importe" placeholder="0.00"></div></div>' +
        '<div class="campo"><label for="m-motivo">Motivo</label>' +
        '<input type="text" id="m-motivo" placeholder="Ej.: cambio traído del banco" autocomplete="off"></div>' +
        '<div class="aviso info">Si el efectivo salió para pagar una compra, registra esa compra como gasto y márcala como pagada con la caja del evento. Así no se cuenta dos veces.</div>';
      const seg = cuerpo.querySelector('#m-tipo');
      seg.addEventListener('click', e => {
        const b = e.target.closest('[data-tipo]'); if (!b) return;
        seg.querySelectorAll('[data-tipo]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      });
    },
    async alGuardar(cuerpo) {
      const importe = aCentavos(cuerpo.querySelector('#m-importe').value);
      if (importe === null || importe <= 0) { tostada('Escribe el importe.', 'malo'); return false; }
      const tipo = cuerpo.querySelector('[data-tipo][aria-pressed="true"]').dataset.tipo;
      const caja = (await dbObtener('caja', datos.evento.id)) || nuevaCaja(datos.evento.id);
      caja.movimientos = caja.movimientos || [];
      caja.movimientos.push({ id: nuevoId('mv'), tipo, importe, motivo: cuerpo.querySelector('#m-motivo').value.trim(), gastoId: null });
      await dbGuardar('caja', caja);
      tostada('Movimiento registrado');
      pintar();
      return true;
    }
  });
}

async function borrarMovimiento(id) {
  const datos = estado.datos;
  const ok = await confirmar({ titulo: 'Quitar movimiento', texto: 'Se quitará este movimiento de la caja.', ok: 'Quitar', peligro: true });
  if (!ok) return;
  const caja = (await dbObtener('caja', datos.evento.id)) || nuevaCaja(datos.evento.id);
  caja.movimientos = (caja.movimientos || []).filter(m => m.id !== id);
  await dbGuardar('caja', caja);
  tostada('Movimiento quitado');
  pintar();
}

function vistaResumen(datos, calc) {
  const ev = datos.evento;
  const k = calc.caja;

  html += '<div class="resultado' + (calc.resultado < 0 ? ' negativo' : '') + '">' +

    '</div>';

  html += '<div class="seccion"><h2>Números del evento</h2><div class="filas-num">' +
    fila('Ventas netas sin impuesto', dinero(calc.ventas.base), 'Descuentos y devoluciones ya restados') +
    fila('Costos atribuibles al evento', '−' + dineroPlano(calc.gastos.atribuible)) +
    (k.comisiones ? fila('Comisiones de cobro', '−' + dineroPlano(k.comisiones)) : '') +
    fila('Resultado del evento', dinero(calc.resultado), null, 'total ' + (calc.resultado < 0 ? 'neg' : 'pos')) +
    '</div></div>';

  html += '<div class="seccion"><h2>Dinero y materiales</h2><div class="filas-num">' +
    fila('Total de compras y desembolsos', dinero(calc.gastos.desembolsado)) +
    (calc.gastos.sobrante !== 0 ? fila('Queda disponible para otros eventos', dinero(calc.gastos.sobrante), 'No es costo de este evento') : '') +
    fila('Reembolsos pendientes', dinero(calc.reembolsos.totalPendiente), calc.reembolsos.totalPendiente > 0 ? 'Dinero personal por devolver' : 'Todo al día') +
    fila('Propinas recibidas', dinero(k.propinas), 'Aparte del resultado operativo') +
    ((ev.impuestoModo || 'sin') !== 'sin' ? fila('Impuesto cobrado', dinero(k.impuestoCobrado), 'No es ingreso de MANNA') : '') +
    fila('Diferencia de conciliación de caja', (k.diferenciaVentas > 0 ? '+' : '') + dinero(k.diferenciaVentas), null,
      k.diferenciaVentas === 0 ? '' : 'neg') +
    '</div>' +
    '<p class="nota-pie">El efectivo que hay en la caja no es la ganancia: incluye la caja inicial, propinas e impuestos.</p></div>';

  if (calc.alertas.length) {
    html += '<div class="seccion"><h2>Por revisar</h2>' + calc.alertas.map(a =>
      '<div class="aviso ' + (a.tipo === 'recibo' ? 'info' : 'alerta') + '"><strong>' +
      esc({ diferencia: 'Diferencia entre ventas y cobros', impuesto: 'Diferencia de impuesto', reembolso: 'Reembolsos pendientes', recibo: 'Recibos faltantes' }[a.tipo] || 'Revisar') +
      (a.importe !== null && a.importe !== undefined ? ': ' + dinero(Math.abs(a.importe)) : '') + '</strong>' + esc(a.texto) + '</div>').join('') + '</div>';
  }

  if (calc.gastos.porCategoria.length) {
    html += '<div class="seccion"><h2>Gastos por categoría</h2><div class="filas-num">' +
      calc.gastos.porCategoria.slice(0, 6).map(c => fila(c.categoria, dinero(c.total))).join('') +
      (calc.gastos.porCategoria.length > 6 ? fila('Ver todo en la pestaña Gastos', '') : '') + '</div></div>';
  }

  if (ev.notas) {
    html += '<div class="seccion"><h2>Notas</h2><div class="tarjeta" style="padding:14px;white-space:pre-wrap">' + esc(ev.notas) + '</div></div>';
